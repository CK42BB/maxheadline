// 9. WIZARD — Glitch
// =====================================================================
class WizardCharacter extends CharacterBase {
  build() {
    this.head = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xBDBDBD, flatShading: true })
    );
    this.group.add(this.head);

    // Hat
    const hatCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.35, 0.8, 6),
      new THREE.MeshStandardMaterial({ color: 0x7C4DFF, flatShading: true })
    );
    // Bend hat tip
    const hatPos = hatCone.geometry.attributes.position;
    for (let i = 0; i < hatPos.count; i++) {
      if (hatPos.getY(i) > 0.3) {
        hatPos.setX(i, hatPos.getX(i) + 0.12);
        hatPos.setZ(i, hatPos.getZ(i) + 0.05);
      }
    }
    hatPos.needsUpdate = true;
    hatCone.geometry.computeVertexNormals();
    hatCone.position.y = 0.6;
    this.group.add(hatCone);

    // Hat brim
    const brim = new THREE.Mesh(
      new THREE.TorusGeometry(0.35, 0.06, 4, 12),
      new THREE.MeshStandardMaterial({ color: 0x651FFF, flatShading: true })
    );
    brim.position.y = 0.25;
    brim.rotation.x = Math.PI * 0.5;
    this.group.add(brim);

    // Stars on hat
    this.stars = [];
    for (let i = 0; i < 4; i++) {
      const star = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.04, 0),
        new THREE.MeshStandardMaterial({ color: 0xFFD54F, emissive: 0xFFD54F, emissiveIntensity: 0.8 })
      );
      const angle = (i / 4) * Math.PI * 0.8 + 0.3;
      star.position.set(
        Math.sin(angle) * 0.25,
        0.4 + i * 0.12,
        Math.cos(angle) * 0.25
      );
      this.stars.push(star);
      this.group.add(star);
    }

    // Glowing eye dots
    [-0.1, 0.1].forEach(x => {
      const eye = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 4, 4),
        new THREE.MeshStandardMaterial({ color: 0x76FF03, emissive: 0x76FF03, emissiveIntensity: 2 })
      );
      eye.position.set(x, 0.05, 0.35);
      this.eyes.push(eye);
      this.group.add(eye);
    });

    // Mustache — two thick swooping halves curling outward from under nose
    this.mustacheParts = [];
    [-1, 1].forEach(side => {
      // Tapered cylinder oriented horizontally, curling outward and slightly down
      const muGeo = new THREE.CylinderGeometry(0.025, 0.015, 0.16, 6);
      const mu = new THREE.Mesh(muGeo, new THREE.MeshStandardMaterial({ color: 0x9E9E9E, flatShading: true }));
      mu.position.set(side * 0.08, -0.1, 0.38);
      mu.rotation.z = Math.PI / 2 * side; // lay horizontal, pointing outward
      mu.rotation.x = 0.25;               // angle slightly forward/down
      mu.rotation.y = side * -0.2;        // curl tips forward
      this.mustacheParts.push(mu);
      this.group.add(mu);
    });

    // Mouth opening (dark, visible between mustache and beard)
    const mouthOpening = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 6, 4),
      new THREE.MeshStandardMaterial({ color: 0x2a1a1a, flatShading: true })
    );
    mouthOpening.position.set(0, -0.18, 0.35);
    mouthOpening.scale.set(1.5, 0.8, 0.5);
    this.mouth = mouthOpening;
    this.group.add(mouthOpening);

    // Full beard — rounded mass below mouth, not cone-shaped
    this.beardParts = [];
    // Main beard body
    const beardBody = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0xB0BEC5, flatShading: true })
    );
    beardBody.position.set(0, -0.35, 0.2);
    beardBody.scale.set(1, 1.4, 0.7);
    this.beardParts.push(beardBody);
    this.group.add(beardBody);

    // Beard wisps — flowing strands below main mass
    for (let i = 0; i < 4; i++) {
      const wisp = new THREE.Mesh(
        new THREE.ConeGeometry(0.03, 0.15 + i * 0.03, 3),
        new THREE.MeshStandardMaterial({ color: 0xBDBDBD, flatShading: true })
      );
      wisp.position.set((i - 1.5) * 0.08, -0.55 - Math.random() * 0.05, 0.18);
      wisp.rotation.x = Math.PI + 0.1;
      this.beardParts.push(wisp);
      this.group.add(wisp);
    }

    this.buildShoulders(0x512DA8);
    // Wizard: Round mystical circles — gold frame, arcane purple sheen
    this.buildShades({
      y: 0.04, z: 0.58, width: 0.45, lensHeight: 0.15,
      lensShape: 'round', frameColor: 0xFFD54F, lensColor: 0x0a001a,
      sheenColor: 0x7C4DFF, accentColor: 0xFFD54F
    });
    return this.group;
  }

  updateSpeaking(time, delta, amplitude) {
    super.updateSpeaking(time, delta, amplitude);
    // Beard sways and stretches during speech
    this.beardParts.forEach((b, i) => {
      b.rotation.z = Math.sin(time * 3 + i * 0.8) * amplitude * 0.15;
      if (i > 0) b.rotation.x = Math.PI + 0.1 + Math.sin(time * 4 + i) * amplitude * 0.1;
    });
    // Mustache bounces independently — slight lift on emphasis
    this.mustacheParts.forEach((m, i) => {
      const side = i === 0 ? -1 : 1;
      m.rotation.z = side * 0.3 + Math.sin(time * 6 + i * Math.PI) * amplitude * 0.12;
      m.position.y = -0.1 + amplitude * 0.02;
    });
    // Mouth opens
    if (this.mouth) {
      this.mouth.scale.y = 0.8 + amplitude * 1.2;
    }
    // Stars spark on exciting news
    this.stars.forEach((s, i) => {
      s.material.emissiveIntensity = 0.5 + amplitude * 2 * Math.sin(time * 8 + i * 2);
    });
  }

  updateIdle(time, delta) {
    super.updateIdle(time, delta);
    // Gentle beard sway
    this.beardParts.forEach((b, i) => {
      b.rotation.z = Math.sin(time * 0.8 + i * 0.5) * 0.05;
    });
    // Mustache subtle breathing motion
    this.mustacheParts.forEach((m, i) => {
      const side = i === 0 ? -1 : 1;
      m.rotation.z = side * 0.3 + Math.sin(time * 1.2 + i * Math.PI) * 0.03;
    });
  }
}

// Highkey voice settings — frenetic Max Headroom energy

  excited:    { stability: 0.2,  similarity_boost: 0.6, style: 0.85, speed: 1.08, use_speaker_boost: true },
  sarcastic:  { stability: 0.25, similarity_boost: 0.6, style: 0.8, speed: 1.0, use_speaker_boost: true },
  alarmed:    { stability: 0.2,  similarity_boost: 0.6, style: 0.85, speed: 1.05, use_speaker_boost: true },

const currentEnergyMode = 'highkey';

class SpeechManager {
  constructor(onAmplitude) {
    this.onAmplitude = onAmplitude;
    this.isSpeaking = false;
    this.currentSource = null;
    this.audioContext = null;
    this.analyser = null;
    this.characterId = 'frog';
    this._animFrame = null;
    this._abortController = null;
    this._audioEl = null;      // HTML5 Audio element (reliable on mobile)
    this._useAudioEl = false;   // set true after unlockAudio
    this._analyserConnected = false;
  }

  // Convert AudioBuffer → WAV ArrayBuffer for HTML5 Audio playback
  _audioBufferToWav(buffer) {
    const numCh = buffer.numberOfChannels;
    const sr = buffer.sampleRate;
    const len = buffer.length;
    const bytesPerSample = 2; // 16-bit
    const dataLen = len * numCh * bytesPerSample;
    const headerLen = 44;
    const wav = new ArrayBuffer(headerLen + dataLen);
    const view = new DataView(wav);
    const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataLen, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, numCh, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * numCh * bytesPerSample, true);
    view.setUint16(32, numCh * bytesPerSample, true);
    view.setUint16(34, 16, true);
    writeStr(36, 'data');
    view.setUint32(40, dataLen, true);
    // Interleave channels
    let offset = 44;
    for (let i = 0; i < len; i++) {
      for (let ch = 0; ch < numCh; ch++) {
        const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
      }
    }
    return wav;
  }

  // Join two AudioBuffers into one continuous buffer with a small gap
  joinBuffers(buf1, buf2, gapSeconds = 0.15) {
    const sampleRate = buf1.sampleRate;
    const gapSamples = Math.floor(sampleRate * gapSeconds);
    const totalLength = buf1.length + gapSamples + buf2.length;
    const channels = Math.max(buf1.numberOfChannels, buf2.numberOfChannels);
    const joined = this.audioContext.createBuffer(channels, totalLength, sampleRate);
    for (let ch = 0; ch < channels; ch++) {
      const out = joined.getChannelData(ch);
      const d1 = ch < buf1.numberOfChannels ? buf1.getChannelData(ch) : new Float32Array(buf1.length);
      const d2 = ch < buf2.numberOfChannels ? buf2.getChannelData(ch) : new Float32Array(buf2.length);
      out.set(d1, 0);
      // gap is already zeros
      out.set(d2, buf1.length + gapSamples);
    }
    return joined;
  }

  _trimTrailingSilence(audioBuffer) {
    // Aggressively trim trailing silence/near-silence from MP3 audio
    // MP3 decoding leaves low-level noise, so threshold must be well above zero
    const threshold = 0.02;
    const data = audioBuffer.getChannelData(0);
    let lastLoud = data.length;
    // Scan backwards in chunks of 256 samples (~6ms) for speed
    for (let i = data.length - 1; i >= 0; i -= 64) {
      let peak = 0;
      for (let j = i; j > Math.max(0, i - 64); j--) {
        peak = Math.max(peak, Math.abs(data[j]));
      }
      if (peak > threshold) {
        lastLoud = Math.min(data.length, i + Math.floor(audioBuffer.sampleRate * 0.02));
        break;
      }
    }
    if (lastLoud >= audioBuffer.length - 200) return audioBuffer;
    const trimmed = this.audioContext.createBuffer(
      audioBuffer.numberOfChannels, lastLoud, audioBuffer.sampleRate
    );
    for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
      trimmed.copyToChannel(audioBuffer.getChannelData(ch).slice(0, lastLoud), ch);
    }
    return trimmed;
  }

  async _ensureAudioContext() {
    if (!this.audioContext) {
      this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      this.analyser = this.audioContext.createAnalyser();
      this.analyser.fftSize = 256;
      this.analyser.smoothingTimeConstant = 0.6;
      this.analyser.connect(this.audioContext.destination);
    }
    if (this.audioContext.state === 'suspended') {
      await this.audioContext.resume();
    }
  }

  // Unlock audio on mobile — must be called inside a user gesture
  async unlockAudio() {
    // 1. Create persistent HTML5 Audio element (most reliable on mobile)
    if (!this._audioEl) {
      this._audioEl = new Audio();
      this._audioEl.setAttribute('playsinline', '');
      this._audioEl.setAttribute('webkit-playsinline', '');
    }
    // Play silent WAV to unlock the audio element on iOS/Android
    this._audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    try { await this._audioEl.play(); } catch(e) { console.warn('[Audio] Silent play failed:', e); }
    this._useAudioEl = true;

    // 2. Also set up AudioContext for analyser (best-effort for mouth animation)
    await this._ensureAudioContext();
    // Try to connect audio element to analyser via captureStream (non-destructive)
    if (!this._analyserConnected && this._audioEl.captureStream) {
      try {
        const stream = this._audioEl.captureStream();
        const source = this.audioContext.createMediaStreamSource(stream);
        source.connect(this.analyser);
        // Don't connect analyser to destination — audio element handles output directly
        this._analyserConnected = true;
        console.log('[Audio] Analyser connected via captureStream');
      } catch(e) {
        console.warn('[Audio] captureStream failed, using synthetic amplitude:', e);
      }
    }

    // 3. Also play silent buffer via AudioContext as backup unlock
    try {
      const buf = this.audioContext.createBuffer(1, 1, this.audioContext.sampleRate);
      const src = this.audioContext.createBufferSource();
      src.buffer = buf;
      src.connect(this.audioContext.destination);
      src.start(0);
    } catch(e) {}
  }

  _startAmplitudeTracking() {
    // If analyser is connected (captureStream worked or using BufferSource), use real data
    if (this.analyser && (this._analyserConnected || this.currentSource)) {
      const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
      const track = () => {
        if (!this.isSpeaking) return;
        this.analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
        const rms = Math.sqrt(sum / dataArray.length) / 255;
        const amplitude = Math.min(1, rms * 3);
        this.onAmplitude(amplitude);
        this._animFrame = requestAnimationFrame(track);
      };
      track();
    } else {
      // Synthetic amplitude for mobile when analyser isn't connected
      let t = 0;
      const track = () => {
        if (!this.isSpeaking) return;
        t += 0.15;
        // Natural speech-like rhythm: fast oscillation modulated by slower envelope
        const amplitude = Math.min(1, Math.max(0,
          0.3 + 0.4 * Math.sin(t * 2.7) * Math.sin(t * 0.8) + 0.2 * Math.random()
        ));
        this.onAmplitude(amplitude);
        this._animFrame = requestAnimationFrame(track);
      };
      track();
    }
  }

  // Fetch + decode audio without playing — returns trimmed AudioBuffer or null
  async fetchAudio(storyId) {
    if (!storyId) return null;

    // Check in-memory cache first (used by splash pre-load)
    if (this._audioCache && this._audioCache[storyId]) {
      return this._audioCache[storyId];
    }

    try {
      await this._ensureAudioContext();
      // Request audio for current character — server generates on-demand if needed
      const url = `/api/audio/${encodeURIComponent(this.characterId)}/${encodeURIComponent(storyId)}/highkey`;
      console.log(`[Audio] Fetching: ${this.characterId} / ${storyId}`);
      // Use a shared abort controller so stop() can cancel in-flight fetches
      if (!this._fetchAbort) this._fetchAbort = new AbortController();
      const response = await fetch(url, { signal: this._fetchAbort.signal });
      if (!response.ok) return null;
      const arrayBuffer = await response.arrayBuffer();
      const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
      return this._trimTrailingSilence(audioBuffer);
    } catch (err) {
      return null; // AbortError or network error
    }
  }

  // Play a pre-decoded AudioBuffer — resolves when done
  async playBuffer(buffer, emotion = 'deadpan') {
    if (!buffer) return;
    await this._ensureAudioContext();

    // Use HTML5 Audio element (reliable on mobile + desktop)
    if (this._useAudioEl && this._audioEl) {
      const wav = this._audioBufferToWav(buffer);
      const blob = new Blob([wav], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);

      this._audioEl.src = url;
      this.isSpeaking = true;
      this._startAmplitudeTracking();

      return new Promise(resolve => {
        this._playingResolve = resolve;
        const done = () => {
          this._playingResolve = null;
          this.isSpeaking = false;
          this.onAmplitude(0);
          if (this._animFrame) cancelAnimationFrame(this._animFrame);
          URL.revokeObjectURL(url);
          resolve(true);
        };
        this._audioEl.onended = done;
        this._audioEl.onerror = done;
        this._audioEl.play().catch(() => {
          console.warn('[Audio] HTML5 play failed, trying BufferSource fallback');
          this.isSpeaking = false;
          URL.revokeObjectURL(url);
          this._playViaBufferSource(buffer, emotion).then(resolve);
        });
      });
    }

    // Fallback: AudioContext BufferSource (desktop, or if audio element not initialized)
    return this._playViaBufferSource(buffer, emotion);
  }

  // Original BufferSource playback (works great on desktop)
  _playViaBufferSource(buffer, emotion = 'deadpan') {
    const source = this.audioContext.createBufferSource();
    source.buffer = buffer;
    const gainNode = this.audioContext.createGain();
    source.connect(gainNode);
    gainNode.connect(this.analyser);

    // Smooth, intentional audio emphasis — never jittery
    {
      let glitchTimer;
      const scheduleGlitch = () => {
        const delay = 4000 + Math.random() * 6000;
        glitchTimer = setTimeout(() => {
          if (!this.isSpeaking) return;
          const orig = gainNode.gain.value;
          const target = 1.2 + Math.random() * 0.2;
          const steps = 8;
          let step = 0;
          const ramp = setInterval(() => {
            step++;
            if (step <= steps / 2) {
              gainNode.gain.value = orig + (target - orig) * (step / (steps / 2));
            } else {
              gainNode.gain.value = target - (target - orig) * ((step - steps / 2) / (steps / 2));
            }
            if (step >= steps) { clearInterval(ramp); gainNode.gain.value = orig; }
          }, 40);
          scheduleGlitch();
        }, delay);
      };
      scheduleGlitch();
      source._glitchTimer = glitchTimer;
    }

    this.currentSource = source;
    this.currentGain = gainNode;
    this.isSpeaking = true;
    this._startAmplitudeTracking();

    return new Promise(resolve => {
      this._playingResolve = resolve;
      const done = () => {
        this._playingResolve = null;
        this.isSpeaking = false;
        this.onAmplitude(0);
        this.currentSource = null;
        if (this._animFrame) cancelAnimationFrame(this._animFrame);
        if (source._glitchTimer) clearTimeout(source._glitchTimer);
        if (this._durationTimer) clearTimeout(this._durationTimer);
        resolve(true);
      };
      const durationMs = buffer.duration * 1000;
      source.start(0);
      this._durationTimer = setTimeout(done, durationMs);
      source.onended = () => {
        if (this._durationTimer) clearTimeout(this._durationTimer);
        done();
      };
    });
  }

  // Legacy: fetch + play in one call (kept for greeting etc.)
  async speakCached(storyId, emotion = 'deadpan') {
    const buffer = await this.fetchAudio(storyId);
    if (!buffer) return false;
    return this.playBuffer(buffer, emotion);
  }

  // Headline voice — more authoritative, slower, dramatic announcement style
  static HEADLINE_VOICE = { stability: 0.1, similarity_boost: 0.55, style: 1.0, speed: 1.0, use_speaker_boost: true };

  // Fetch TTS audio without playing — returns trimmed AudioBuffer or null
  async fetchTTSBuffer(text, emotion = 'deadpan', isHeadline = false) {
    if (!text || !text.trim()) return null;
    const voice = CHARACTER_VOICES[this.characterId] || CHARACTER_VOICES.frog;
    const settings = isHeadline
      ? SpeechManager.HEADLINE_VOICE
      : (EMOTION_VOICE_SETTINGS[emotion] || EMOTION_VOICE_SETTINGS.deadpan);
    try {
      await this._ensureAudioContext();
      const response = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voiceId: voice.voiceId, voiceSettings: settings, modelId: 'eleven_multilingual_v2' })
      });
      if (!response.ok) return null;
      const arrayBuffer = await response.arrayBuffer();
      const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
      return this._trimTrailingSilence(audioBuffer);
    } catch (err) {
      return null;
    }
  }

  async speak(text, emotion = 'deadpan') {
    if (!text || !text.trim()) return;
    const voice = CHARACTER_VOICES[this.characterId] || CHARACTER_VOICES.frog;
    const settings = EMOTION_VOICE_SETTINGS[emotion] || EMOTION_VOICE_SETTINGS.deadpan;

    try {
      await this._ensureAudioContext();

      // Cancel any in-flight TTS request
      if (this._abortController) this._abortController.abort();
      this._abortController = new AbortController();

      const response = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          voiceId: voice.voiceId,
          voiceSettings: settings,
          modelId: 'eleven_multilingual_v2'
        }),
        signal: this._abortController.signal
      });

      if (!response.ok) {
        console.warn('ElevenLabs TTS failed, falling back to Web Speech API');
        return this._fallbackSpeak(text, emotion);
      }

      const arrayBuffer = await response.arrayBuffer();
      const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
      const trimmedBuffer = this._trimTrailingSilence(audioBuffer);

      // Use the unified playBuffer (handles mobile audio element + desktop BufferSource)
      return this.playBuffer(trimmedBuffer, emotion);
    } catch (err) {
      // Don't fallback to Web Speech if request was intentionally aborted
      if (err.name === 'AbortError') return;
      console.warn('TTS request failed, falling back:', err);
      return this._fallbackSpeak(text, emotion);
    }
  }

  // Web Speech API fallback if ElevenLabs is unavailable
  _fallbackSpeak(text, emotion) {
    return new Promise((resolve) => {
      const synth = window.speechSynthesis;
      if (!synth) { resolve(); return; }
      const em = EMOTION_MAP[emotion] || EMOTION_MAP.deadpan;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = em.voiceRate;
      utterance.pitch = em.voicePitch;

      utterance.onboundary = () => {
        const amp = 0.6 + Math.random() * 0.4;
        this.onAmplitude(amp);
        setTimeout(() => this.onAmplitude(amp * 0.3), 80);
      };
      utterance.onstart = () => { this.isSpeaking = true; };
      utterance.onend = () => { this.isSpeaking = false; this.onAmplitude(0); resolve(); };
      utterance.onerror = () => { this.isSpeaking = false; this.onAmplitude(0); resolve(); };
      synth.speak(utterance);
    });
  }

  stop() {
    // Abort any in-flight TTS fetch
    if (this._abortController) { this._abortController.abort(); this._abortController = null; }
    // Abort any in-flight audio fetches (fetchAudio)
    if (this._fetchAbort) { this._fetchAbort.abort(); this._fetchAbort = null; }
    if (this._durationTimer) { clearTimeout(this._durationTimer); this._durationTimer = null; }
    // Stop HTML5 Audio element
    if (this._audioEl) {
      this._audioEl.pause();
      this._audioEl.onended = null;
      this._audioEl.onerror = null;
    }
    // Stop BufferSource
    if (this.currentSource) {
      if (this.currentSource._glitchTimer) clearTimeout(this.currentSource._glitchTimer);
      try { this.currentSource.disconnect(); } catch(e) {}
      try { this.currentSource.stop(); } catch(e) {}
      this.currentSource = null;
    }
    if (this.currentGain) {
      try { this.currentGain.disconnect(); } catch(e) {}
      this.currentGain = null;
    }
    window.speechSynthesis?.cancel();
    this.isSpeaking = false;
    this.onAmplitude(0);
    if (this._animFrame) cancelAnimationFrame(this._animFrame);
    // Immediately resolve any pending playBuffer promise so the async chain unblocks
    if (this._playingResolve) {
      const r = this._playingResolve;
      this._playingResolve = null;
      r(false);
    }
  }
}

// =====================================================================
// NEWS ENGINE
// =====================================================================
class NewsEngine {
  constructor() {
    this.stories = [];
    this.mode = 'everything';
    this.isLoading = false;
    this._cache = {};
    this.fetchedAt = null;
  }

  async fetchNews(mode = this.mode, characterName = 'Ribbitz') {
    this.mode = mode;

    // Check local cache (30 min expiry — server handles the 6am/6pm refresh)
    const cached = this._cache[mode];
    if (cached && Date.now() - cached.time < 1800000) {
      this.stories = cached.stories;
      this.fetchedAt = cached.fetchedAt;
      return this.stories;
    }

    this.isLoading = true;
    try {
      // Try cached stories first (fast, served from server cache)
      let res = await fetch(`/api/stories?mode=${mode}`);
      let data = await res.json();

      if (res.ok && data.stories && data.stories.length > 0) {
        this.stories = data.stories;
        this.fetchedAt = data.fetchedAtET || data.fetchedAt;
      } else {
        // No cache — trigger live fetch via legacy endpoint
        res = await fetch('/api/news', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, characterName })
        });
        data = await res.json();
        if (data.error) throw new Error(data.error);
        this.stories = data.stories || [];
        this.fetchedAt = new Date().toLocaleString();
      }

      this._cache[mode] = { stories: this.stories, time: Date.now(), fetchedAt: this.fetchedAt };
    } catch (err) {
      console.error('Failed to fetch news:', err);
      this.stories = this._generateFallbackStories(mode);
    }
    this.isLoading = false;
    return this.stories;
  }

  _generateFallbackStories(mode) {
    const emotions = ['excited', 'sarcastic', 'alarmed', 'amused', 'deadpan', 'outraged', 'hopeful', 'bewildered'];
    const categories = ['tech', 'politics', 'science', 'culture', 'environment', 'world', 'economy', 'health'];
    const headlines = {
      everything: [
        'Breaking: The Internet Still Exists, Somehow',
        'Scientists Discover Water is Indeed Wet',
        'Politicians Promise Things Will Be Different This Time',
        'Tech CEO Announces Revolutionary Way to Send Messages',
        'Climate Report Says Exactly What You Expected',
        'Economy Does That Thing It Does Sometimes',
        'Space Rock Narrowly Misses Becoming Our Problem',
        'Study Confirms What Your Grandmother Always Said'
      ],
      uponly: [
        'Coral Reef Actually Growing Back for Once',
        'Kid Invents Thing That Might Actually Help',
        'Community Comes Together in Genuinely Nice Way',
        'Renewable Energy Breaks Another Record',
        'Endangered Species Makes Surprising Comeback',
        'Volunteers Clean Up Entire Coastline',
        'Medical Breakthrough Gives Millions Hope',
        'Two Countries Resolve Dispute Through Dialogue'
      ],
      sota: [
        'New Foundation Model Shatters Every Benchmark',
        'Humanoid Robot Learns to Cook From YouTube Videos',
        'Quantum Computer Solves Problem in Seconds That Would Take Millennia',
        'Brain-Computer Interface Restores Full Speech to Paralyzed Patient',
        'Fusion Reactor Achieves Net Energy Gain for First Time',
        'AI Agent Autonomously Discovers New Antibiotic Compound',
        'Self-Driving Fleet Completes One Billion Miles Zero Incidents',
        'SpaceX Starship Successfully Lands on Mars Surface'
      ]
    };
    return (headlines[mode] || headlines.everything).map((h, i) => ({
      id: `fallback-${i}`,
      headline: h,
      summary: `We c-c-couldn't reach our news sources right now. But trust me, this one's a doozy. The API gremlins are at it again. Stay tuned while we recalibrate the signal.`,
      emotion: emotions[i],
      severity: Math.floor(Math.random() * 7) + 2,
      source: 'MaxHeadline Internal',
      category: categories[i]
    }));
  }
}

// =====================================================================
// FINANCIAL TICKER — diagonal scrolling behind anchor (CNBC style)
// =====================================================================
class FinancialTicker {
  constructor(scene) {
    this.scene = scene;
    this.tickerData = [];
    this._scrollPx = 0;
    this._contentWidth = 0;
    this._items = [];

    // Canvas for ticker texture — fixed size, redrawn each frame
    this.canvas = document.createElement('canvas');
    this.canvas.width = 2048;
    this.canvas.height = 64;
    this.ctx = this.canvas.getContext('2d');

    this.texture = new THREE.CanvasTexture(this.canvas);
    this.texture.minFilter = THREE.LinearFilter;

    // Create ticker stripe — behind character (z=-0.4), in front of hero photo (z=-0.6)
    const geo = new THREE.PlaneGeometry(6, 0.25);
    const mat = new THREE.MeshBasicMaterial({
      map: this.texture,
      transparent: true,
      opacity: 0.92,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.set(0.3, -0.1, -0.4);
    this.mesh.rotation.z = Math.PI * 0.08; // ~15 degrees
    this.mesh.renderOrder = -1; // render BEFORE character so character draws on top
    this.scene.add(this.mesh);

    // Render placeholder immediately so mesh is visible
    this.renderTexture();

    // Fetch data immediately and refresh every 2 min
    this.fetchData();
    this._interval = setInterval(() => this.fetchData(), 120000);
  }

  async fetchData() {
    try {
      const res = await fetch('/api/ticker');
      if (!res.ok) return;
      this.tickerData = await res.json();
      this.renderTexture();
    } catch {}
  }

  // Pre-measure item widths when data changes
  _measureItems() {
    if (this.tickerData.length === 0) { this._contentWidth = 0; this._items = []; return; }
    const ctx = this.ctx;
    ctx.font = 'bold 28px monospace';
    let total = 0;
    this._items = this.tickerData.map(item => {
      const priceStr = item.price >= 1000 ? item.price.toLocaleString('en-US', { maximumFractionDigits: 0 })
        : item.price >= 1 ? item.price.toFixed(2) : item.price.toFixed(4);
      const changeStr = (item.up ? '+' : '') + item.change.toFixed(2) + '%';
      const symW = ctx.measureText(item.symbol).width;
      const priceW = ctx.measureText(priceStr).width;
      const changeW = ctx.measureText(changeStr).width;
      const w = symW + 14 + priceW + 14 + changeW + 60;
      total += w;
      return { symbol: item.symbol, priceStr, changeStr, up: item.up, symW, priceW, changeW, totalW: w };
    });
    this._contentWidth = total;
  }

  renderTexture() {
    const ctx = this.ctx;
    const W = this.canvas.width;
    const H = this.canvas.height;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0c0820';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(0, 0, W, 2);
    ctx.fillStyle = '#ff2d95';
    ctx.fillRect(0, H - 2, W, 2);

    ctx.font = 'bold 28px monospace';
    ctx.textBaseline = 'middle';

    if (this.tickerData.length === 0) {
      ctx.fillStyle = '#8088a0';
      const noData = 'AWAITING MARKET DATA \u25C6 ';
      const noDataW = ctx.measureText(noData).width;
      for (let x = 0; x < W; x += noDataW) {
        ctx.fillText(noData, x, H / 2);
      }
      this.texture.needsUpdate = true;
      return;
    }

    this._measureItems();
    this._drawFrame(0); // initial static frame
  }

  // Draw visible items at current scroll offset
  _drawFrame(scrollPx) {
    const ctx = this.ctx;
    const W = this.canvas.width;
    const H = this.canvas.height;
    const cw = this._contentWidth;
    if (!cw || !this._items) return;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0c0820';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(0, 0, W, 2);
    ctx.fillStyle = '#ff2d95';
    ctx.fillRect(0, H - 2, W, 2);

    ctx.font = 'bold 28px monospace';
    ctx.textBaseline = 'middle';

    // Start drawing from negative offset so items scroll left
    let x = -(scrollPx % cw);
    // Draw enough passes to fill the canvas
    while (x < W) {
      for (const it of this._items) {
        // Skip items entirely off-screen left
        if (x + it.totalW < 0) { x += it.totalW; continue; }
        // Stop if past right edge
        if (x > W) return;

        ctx.fillStyle = '#a0a8c0';
        ctx.fillText(it.symbol, x, H / 2);
        x += it.symW + 14;

        ctx.fillStyle = '#e0e0e8';
        ctx.fillText(it.priceStr, x, H / 2);
        x += it.priceW + 14;

        ctx.fillStyle = it.up ? '#39ff14' : '#ff4444';
        ctx.fillText(it.changeStr, x, H / 2);
        x += it.changeW + 60;
      }
    }
  }

  update(elapsed) {
    if (!this._contentWidth) return;
    // Pixel-based scroll — redraw visible portion each frame
    this._scrollPx = (this._scrollPx || 0) + 0.8;
    this._drawFrame(this._scrollPx);
    this.texture.needsUpdate = true;
  }

  dispose() {
    clearInterval(this._interval);
    this.scene.remove(this.mesh);
  }
}

// =====================================================================
// STORY POLYHEDRON — "Over the shoulder" 3D news image display
// =====================================================================
class StoryHeroImage {
  constructor(scene, camera) {
    this.scene = scene;
    this.camera = camera;
    this.activeIndex = -1;
    this.stories = [];
    this.loadedImages = []; // HTMLImageElement per story

    // High-res canvas for compositing
    this.canvas = document.createElement('canvas');
    this.canvas.width = 960;
    this.canvas.height = 1200;
    this.ctx = this.canvas.getContext('2d');
    this.texture = new THREE.CanvasTexture(this.canvas);
    this.texture.minFilter = THREE.LinearFilter;

    // Single flat plane — always behind character
    this.planeZ = -0.6;
    this.mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({
        map: this.texture,
        transparent: true,
        opacity: 0.9,
        side: THREE.FrontSide,
        depthWrite: false
      })
    );
    this.mesh.renderOrder = -2; // behind ticker (-1) and character (0)
    scene.add(this.mesh);

    // Neon border frame (thin box wireframe around the image)
    this.borderMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff, transparent: true, opacity: 0.5
    });

    this._updatePlaneSize();
  }

  _updatePlaneSize() {
    // Calculate visible frustum at the plane's z-depth
    const dist = this.camera.position.z - this.planeZ;
    const vFov = this.camera.fov * Math.PI / 180;
    const visH = 2 * dist * Math.tan(vFov / 2);
    const visW = visH * this.camera.aspect;

    // Cover right ~52% of visible width, full height
    const panelW = visW * 0.52;
    const panelH = visH * 1.05;

    // Right edge flush with frustum edge
    const rightEdge = visW / 2;
    const panelX = rightEdge - panelW / 2;

    // Vertically centered on camera lookAt point
    const lookAtY = 0.1;

    this.mesh.scale.set(panelW, panelH, 1);
    this.mesh.position.set(panelX, lookAtY, this.planeZ);
  }

  onResize() {
    this._updatePlaneSize();
  }

  _loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = `/api/image-proxy?url=${encodeURIComponent(url)}`;
      setTimeout(() => reject('timeout'), 8000);
    });
  }

  async loadStoryImages(stories) {
    this.stories = stories;
    this.loadedImages = new Array(stories.length).fill(null);

    const promises = stories.slice(0, 8).map(async (story, i) => {
      if (story.imageUrl) {
        try {
          this.loadedImages[i] = await this._loadImage(story.imageUrl);
        } catch(e) { /* fallback rendering */ }
      }
      if (i === this.activeIndex) this._render();
    });

    await Promise.all(promises);
    if (this.activeIndex >= 0) this._render();
  }

  setActiveStory(index) {
    if (index === this.activeIndex) return;
    this.activeIndex = index;
    this._render();
  }

  _render() {
    const story = this.stories[this.activeIndex];
    if (!story) return;

    const W = this.canvas.width, H = this.canvas.height;
    const ctx = this.ctx;
    const img = this.loadedImages[this.activeIndex];
    const em = EMOTION_MAP[story.emotion] || EMOTION_MAP.deadpan;
    const emColor = em.color || '#00f0ff';

    ctx.clearRect(0, 0, W, H);

    if (img) {
      // Cover-fit: scale to fill, crop overflow
      const scale = Math.max(W / img.width, H / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);

      // Subtle dark overlay for depth
      ctx.fillStyle = 'rgba(10,10,26,0.15)';
      ctx.fillRect(0, 0, W, H);
    } else {
      // Fallback: vaporwave gradient with story info
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, emColor);
      grad.addColorStop(0.5, '#1a0a2e');
      grad.addColorStop(1, '#0a0a1a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // "SIGNAL LOST" text
      ctx.globalAlpha = 0.3;
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
        ctx.fillRect(0, Math.random() * H, W, 2 + Math.random() * 4);
      }
      ctx.globalAlpha = 1;
    }

    // Scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

    // Top gradient overlay — smooth feathered fade, no hard edge
    const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.35);
    topGrad.addColorStop(0, 'rgba(10,10,26,0.92)');
    topGrad.addColorStop(0.35, 'rgba(10,10,26,0.75)');
    topGrad.addColorStop(0.6, 'rgba(10,10,26,0.4)');
    topGrad.addColorStop(0.8, 'rgba(10,10,26,0.15)');
    topGrad.addColorStop(1, 'rgba(10,10,26,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, W, H * 0.35);

    // Category tag
    ctx.fillStyle = emColor;
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText((story.category || 'NEWS').toUpperCase(), W / 2, 140);

    // Headline
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 34px monospace';
    const words = (story.headline || '').split(' ');
    let line = '', ty = 180;
    words.forEach(w => {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > W - 80) {
        ctx.fillText(line.trim(), W / 2, ty);
        line = w + ' ';
        ty += 40;
      } else line = test;
    });
    ctx.fillText(line.trim(), W / 2, ty);

    // Source
    ctx.fillStyle = emColor;
    ctx.font = 'bold 16px monospace';
    ctx.fillText((story.source || '').toUpperCase(), W / 2, ty + 30);

    // Neon border
    ctx.strokeStyle = emColor;
    ctx.lineWidth = 4;
    ctx.shadowColor = emColor;
    ctx.shadowBlur = 15;
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.shadowBlur = 0;

    this.texture.needsUpdate = true;

    // Update border material color to match emotion
    if (this.borderMat) this.borderMat.color.set(emColor);
  }

  update(time, delta) {
    // Static panel — no movement, edges never shift
  }
}

// =====================================================================
// PLAYBACK CONTROLLER
// =====================================================================
class PlaybackController {
  constructor(newsEngine, speechManager, onActiveStory) {
    this.news = newsEngine;
    this.speech = speechManager;
    this.onActiveStory = onActiveStory;
    this.isAutoplay = false;
    this.currentIndex = -1;
    this.isPlaying = false;
    this._cancelled = false;
    this._playGeneration = 0; // monotonic counter — every new play invalidates old ones
  }

  async playStory(index) {
    // Immediately kill ALL previous audio — no waiting
    this.speech.stop();
    this._cancelled = true;
    this.isPlaying = false;

    // Bump generation — any in-flight async from previous calls will see stale gen and bail
    const gen = ++this._playGeneration;

    const story = this.news.stories[index];
    if (!story) return;

    this._cancelled = false;
    this.currentIndex = index;
    this.isPlaying = true;
    this.onActiveStory(index, story);

    // Show loading spinner on this story's play button
    const playBtn = document.querySelector(`.story-card[data-index="${index}"] .story-play`);
    if (playBtn) playBtn.classList.add('loading');

    // Track play stat
    fetch('/api/stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ characterId: this.speech.characterId, action: 'play' })
    }).catch(() => {});

    // Prefetch BOTH headline + summary audio in parallel
    const [headlineBuf, summaryBuf] = await Promise.all([
      this.speech.fetchAudio(`${story.id}-headline`),
      this.speech.fetchAudio(`${story.id}-summary`)
    ]);

    // If user clicked something else during fetch, bail immediately
    if (gen !== this._playGeneration) return;

    if (headlineBuf && summaryBuf) {
      if (playBtn) playBtn.classList.remove('loading');
      const joined = this.speech.joinBuffers(headlineBuf, summaryBuf, 0.6);
      await this.speech.playBuffer(joined, story.emotion);
      if (gen !== this._playGeneration) return;
      this.isPlaying = false;
      if (this.isAutoplay && this.currentIndex < this.news.stories.length - 1) {
        await new Promise(r => setTimeout(r, 800));
        if (gen !== this._playGeneration) return;
        this.playStory(this.currentIndex + 1);
      }
      return;
    }

    // No cached audio — live TTS: fetch headline + summary in parallel, then join
    const summaryText = story.summaryHighkey || story.summary;
    const [liveHeadline, liveSummary] = await Promise.all([
      this.speech.fetchTTSBuffer(story.headline, story.emotion, true),
      this.speech.fetchTTSBuffer(summaryText, story.emotion, false)
    ]);
    if (gen !== this._playGeneration) return;

    if (playBtn) playBtn.classList.remove('loading');
    if (liveHeadline && liveSummary) {
      const joined = this.speech.joinBuffers(liveHeadline, liveSummary, 0.6);
      await this.speech.playBuffer(joined, story.emotion);
    } else if (liveHeadline) {
      await this.speech.playBuffer(liveHeadline, story.emotion);
    } else {
      // Last resort — Web Speech API
      await this.speech.speak(story.headline, story.emotion);
      if (gen !== this._playGeneration) return;
      await this.speech.speak(summaryText, story.emotion);
    }
    if (gen !== this._playGeneration) return;

    this.isPlaying = false;

    if (this.isAutoplay && this.currentIndex < this.news.stories.length - 1) {
      await new Promise(r => setTimeout(r, 800));
      if (gen !== this._playGeneration) return;
      this.playStory(this.currentIndex + 1);
    }
  }

  skip() {
    this._playGeneration++;
    this.speech.stop();
    this._cancelled = true;
    this.isPlaying = false;
    if (this.currentIndex < this.news.stories.length - 1) {
      setTimeout(() => this.playStory(this.currentIndex + 1), 100);
    }
  }

  toggleAutoplay() {
    this.isAutoplay = !this.isAutoplay;
    if (this.isAutoplay && !this.isPlaying && this.news.stories.length > 0) {
      this.playStory(Math.max(0, this.currentIndex + 1));
    } else if (!this.isAutoplay) {
      // Pausing — immediately kill audio
      this.stop();
    }
  }

  stop() {
    this._playGeneration++;
    this._cancelled = true;
    this.speech.stop();
    this.isPlaying = false;
  }
}

// =====================================================================
// MAIN APPLICATION
// =====================================================================
class MaxHeadlineApp {
  constructor() {
    this.clock = new THREE.Clock();
    this.newsEngine = new NewsEngine();
    this.currentCharacter = null;
    this.currentCharacterId = null;
    this.characterInstances = {};
    this.currentMode = 'everything';
    this.floatingProps = [];
    this.reactiveSprites = [];
    this.particles = null;
    this.particlePositions = null;
    this.neonRing = null;
    this.neonRing2 = null;
    this.skyMaterial = null;
    this.gridHelper = null;
    this.modeGlitchMult = 1;
    this.storyHero = null;
    this.shadesVisible = true;
    this._audioReady = new Map(); // charId → Set<storyId>
    this._audioProbeInterval = null;
  }

  // Phase 1: Build 3D scene, characters, UI — no audio, no autoplay
  async initScene() {
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('broadcast-canvas');

    // Renderer
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.8;
    this.updateRendererSize();

    // Scene
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x0a0a2a, 0.035);

    // Generate procedural environment map for chrome/metallic reflections
    // Predominantly neutral grays/whites so chrome reads as silver, with subtle color accents
    const pmrem = new THREE.PMREMGenerator(this.renderer);
    pmrem.compileCubemapShader();
    const envScene = new THREE.Scene();
    const envGeo = new THREE.SphereGeometry(10, 16, 16);
    const envMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {},
      vertexShader: `varying vec3 vWorldPos;
        void main() { vWorldPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vWorldPos;
        void main() {
          float y = normalize(vWorldPos).y;
          vec3 top = vec3(0.6, 0.62, 0.7);
          vec3 mid = vec3(0.35, 0.35, 0.4);
          vec3 bot = vec3(0.15, 0.15, 0.18);
          vec3 col = y > 0.0 ? mix(mid, top, y) : mix(mid, bot, -y);
          col += vec3(1.0, 0.95, 0.9) * pow(max(0.0, dot(normalize(vWorldPos), vec3(1,0.5,0.5))), 12.0) * 0.6;
          col += vec3(0.7, 0.85, 1.0) * pow(max(0.0, dot(normalize(vWorldPos), vec3(-0.5,0.3,1))), 10.0) * 0.3;
          gl_FragColor = vec4(col, 1.0);
        }`
    });
    envScene.add(new THREE.Mesh(envGeo, envMat));
    // Bright white key light for crisp specular highlights
    const envLight1 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff }));
    envLight1.position.set(3, 5, 2);
    envScene.add(envLight1);
    // Secondary cooler fill
    const envLight2 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xd0d8e0 }));
    envLight2.position.set(-4, 2, 3);
    envScene.add(envLight2);
    // Rim highlight
    const envLight3 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xe8e0f0 }));
    envLight3.position.set(0, -1, -4);
    envScene.add(envLight3);
    this.scene.environment = pmrem.fromScene(envScene, 0.04).texture;
    pmrem.dispose();

    // === CubeCamera for real-time mirror reflections (robot chrome) ===
    this.cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });
    this.cubeCamera = new THREE.CubeCamera(0.1, 50, this.cubeRenderTarget);
    this.scene.add(this.cubeCamera);
    this._cubeCameraFrame = 0;

    // Hidden colorful "studio" panels — only visible during CubeCamera render
    // Creates vivid neon reflections on chrome surfaces
    this.reflectionPanels = [];
    const addReflPanel = (geo, color, emissive, emissiveI, pos, rot) => {
      const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
      if (emissive) { /* use MeshStandardMaterial for emissive panels */
        const m = new THREE.MeshStandardMaterial({
          color, emissive: emissive, emissiveIntensity: emissiveI || 2,
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, m);
        mesh.position.copy(pos);
        if (rot) mesh.rotation.copy(rot);
        mesh.visible = false; // hidden from main camera
        this.scene.add(mesh);
        this.reflectionPanels.push(mesh);
        return;
      }
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      if (rot) mesh.rotation.copy(rot);
      mesh.visible = false;
      this.scene.add(mesh);
      this.reflectionPanels.push(mesh);
    };

    const panelGeo = new THREE.PlaneGeometry(4, 3);
    const smallPanel = new THREE.PlaneGeometry(2, 2);
    const sphereGeo = new THREE.SphereGeometry(0.6, 8, 8);

    // Left wall — hot pink neon
    addReflPanel(panelGeo, 0xff2d95, 0xff2d95, 3,
      new THREE.Vector3(-3, 0.5, 0), new THREE.Euler(0, Math.PI / 2, 0));
    // Right wall — cyan (story image side)
    addReflPanel(panelGeo, 0x00f0ff, 0x00f0ff, 3,
      new THREE.Vector3(3, 0.5, 0), new THREE.Euler(0, -Math.PI / 2, 0));
    // Top — warm gold studio light
    addReflPanel(panelGeo, 0xfff0c0, 0xfff0c0, 4,
      new THREE.Vector3(0, 3, 0), new THREE.Euler(Math.PI / 2, 0, 0));
    // Below — deep purple
    addReflPanel(smallPanel, 0xb829dd, 0xb829dd, 2,
      new THREE.Vector3(0, -2, 0), new THREE.Euler(-Math.PI / 2, 0, 0));
    // Behind — vaporwave gradient panel
    addReflPanel(panelGeo, 0x6a2aaa, 0x6a2aaa, 2,
      new THREE.Vector3(0, 0.5, -2), new THREE.Euler(0, 0, 0));
    // Front fill — subtle warm
    addReflPanel(smallPanel, 0xff6b2b, 0xff6b2b, 1.5,
      new THREE.Vector3(0, 0, 3), new THREE.Euler(0, Math.PI, 0));
    // Bright accent spheres — scattered color pops
    addReflPanel(sphereGeo, 0x39ff14, 0x39ff14, 4,
      new THREE.Vector3(-1.5, 1.5, -1), null);
    addReflPanel(sphereGeo, 0xff2d95, 0xff2d95, 4,
      new THREE.Vector3(2, -0.5, -0.5), null);
    addReflPanel(sphereGeo, 0x00f0ff, 0x00f0ff, 4,
      new THREE.Vector3(1.5, 2, 0.5), null);

    // Camera
    const aspect = viewport.clientWidth / viewport.clientHeight;
    this.camera = new THREE.PerspectiveCamera(35, aspect, 0.1, 100);
    this.camera.position.set(0, 0.3, 3);
    this.camera.lookAt(-0.1, 0.1, 0);

    // Stage
    this.createBroadcastStage();
    this.createBroadcastLighting();

    // Story hero image (flat panel behind anchor, right 45% of screen)
    this.storyHero = new StoryHeroImage(this.scene, this.camera);

    // Financial ticker — diagonal behind anchor
    this.financialTicker = new FinancialTicker(this.scene);

    // Post-processing
    this.setupPostProcessing();

    // Random character on every load
    const charIds = Object.keys(CHARACTER_REGISTRY);
    const randomChar = charIds[Math.floor(Math.random() * charIds.length)];
    this.switchCharacter(randomChar);

    // Speech — set to the randomly chosen character
    this.speechAmplitude = 0;
    this.speech = new SpeechManager((amp) => { this.speechAmplitude = amp; });
    this.speech.characterId = this.currentCharacterId;

    // Playback
    this.playback = new PlaybackController(this.newsEngine, this.speech, (idx, story) => {
      this.setActiveStory(idx);
      if (this.currentCharacter) this.currentCharacter.setEmotion(story.emotion);
      if (this.currentCharacter) this.currentCharacter.triggerGlitch();
      if (this.storyHero) this.storyHero.setActiveStory(idx);
      // Shuffle lens reflection pattern per story for vibe shift
      LENS_REFLECTION.shufflePattern();
    });

    // UI
    this.setupUI();

    // Render loop starts in launchBroadcast() after splash dismisses (avoids zero-size framebuffer errors)

    // Resize
    window.addEventListener('resize', () => this.onResize());

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); this.playback.toggleAutoplay(); this.updateAutoplayBtn(); }
      if (e.code === 'KeyN') this.playback.skip();
    });

    // UI auto-hide on idle (3s no mouse/touch)
    let uiIdleTimer = null;
    const showUI = () => {
      document.body.classList.remove('ui-hidden');
      clearTimeout(uiIdleTimer);
      uiIdleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 3000);
    };
    window.addEventListener('mousemove', showUI);
    window.addEventListener('mousedown', showUI);
    window.addEventListener('touchstart', showUI);
    window.addEventListener('touchmove', showUI);
    window.addEventListener('keydown', showUI);
    // Start the initial timer
    uiIdleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 3000);
  }

  // Phase 2: Fetch news (called during splash screen)
  async initNews() {
    this.showLoading();
    await this.newsEngine.fetchNews('everything', CHARACTER_META[this.currentCharacterId].name);
    this.renderStoryFeed();
    this._probeAudioStatus(this.currentCharacterId);
    this.updateHeadlineTicker();
    if (this.storyHero && this.newsEngine.stories.length) {
      await this.storyHero.loadStoryImages(this.newsEngine.stories);
      this.storyHero.setActiveStory(0);
    }
  }

  // Phase 3: User clicked "LET'S NEWS" — AudioContext is active, start playback
  async launchBroadcast() {
    if (this.newsEngine.stories.length > 0) {
      // Play intro line
      try {
        const introBuf = await this.speech.fetchTTSBuffer("Here's what happened today.", 'amused', true);
        if (introBuf) await this.speech.playBuffer(introBuf, 'amused');
      } catch (e) { /* skip intro if TTS unavailable */ }

      // If we have pre-loaded audio from splash, decode and cache it now
      if (this._preloadedHeadline && this._preloadedSummary) {
        try {
          const firstStory = this.newsEngine.stories[0];
          const ctx = this.speech.audioContext;
          const hBuf = await ctx.decodeAudioData(this._preloadedHeadline);
          const sBuf = await ctx.decodeAudioData(this._preloadedSummary);
          // Cache decoded buffers so playStory finds them instantly
          this.speech._audioCache = this.speech._audioCache || {};
          this.speech._audioCache[`${firstStory.id}-headline`] = this.speech._trimTrailingSilence(hBuf);
          this.speech._audioCache[`${firstStory.id}-summary`] = this.speech._trimTrailingSilence(sBuf);
        } catch (e) { /* decode failed, playStory will fetch normally */ }
        this._preloadedHeadline = null;
        this._preloadedSummary = null;
      }

      // Start autoplay
      this.playback.isAutoplay = true;
      this.updateAutoplayBtn();
      this.playback.playStory(0);

      // Lazy load remaining stories' audio in background
      this._lazyLoadAudio();
    }
  }

  // Background audio preload for upcoming stories
  _lazyLoadAudio() {
    const stories = this.newsEngine.stories;
    if (stories.length <= 1) return;

    let i = 1;
    const loadNext = async () => {
      if (i >= stories.length) return;
      const story = stories[i];
      try {
        await this.speech.fetchAudio(`${story.id}-headline`);
        await this.speech.fetchAudio(`${story.id}-summary`);
      } catch (e) { /* non-critical */ }
      i++;
      // Small delay to avoid hammering server
      setTimeout(loadNext, 200);
    };
    // Start after a short delay to prioritize first story playback
    setTimeout(loadNext, 1000);
  }

  // ---------- SCENE ----------

  createBroadcastStage() {
    // Grid floor — brighter, more visible
    this.gridHelper = new THREE.GridHelper(100, 40, 0xff2d95, 0x6a2aaa);
    this.gridHelper.position.y = -2;
    const gridMats = Array.isArray(this.gridHelper.material) ? this.gridHelper.material : [this.gridHelper.material];
    gridMats.forEach(m => { m.transparent = true; m.opacity = 0.6; });
    this.scene.add(this.gridHelper);

    // Neon ground plane glow
    const groundGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshBasicMaterial({ color: 0xff2d95, transparent: true, opacity: 0.06, side: THREE.DoubleSide })
    );
    groundGlow.rotation.x = -Math.PI / 2;
    groundGlow.position.y = -1.99;
    this.scene.add(groundGlow);

    // Gradient sky — brighter colors
    const skyGeo = new THREE.SphereGeometry(50, 32, 32);
    this.skyMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTopColor: { value: new THREE.Color(0x1a0040) },
        uMidColor: { value: new THREE.Color(0x6b2fa0) },
        uBotColor: { value: new THREE.Color(0xff2d95) },
        uTime: { value: 0 }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uTopColor, uMidColor, uBotColor;
        uniform float uTime;
        varying vec3 vWorldPos;
        void main() {
          float h = normalize(vWorldPos).y * 0.5 + 0.5;
          vec3 col = mix(uBotColor, uMidColor, smoothstep(0.0, 0.35, h));
          col = mix(col, uTopColor, smoothstep(0.35, 0.9, h));
          // Vivid scan drift
          col += 0.04 * sin(vWorldPos.y * 15.0 + uTime * 2.5);
          // Star twinkle
          float star = step(0.997, fract(sin(dot(floor(vWorldPos.xy * 8.0), vec2(12.9898, 78.233))) * 43758.5));
          col += star * (0.5 + 0.5 * sin(uTime * 3.0 + vWorldPos.x * 10.0));
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      side: THREE.BackSide
    });
    this.scene.add(new THREE.Mesh(skyGeo, this.skyMaterial));

    // === FLOATING PROPS — 8+ sided shapes only (meme-polyhedra fill the rest) ===
    const shapes = [
      new THREE.TorusGeometry(0.6, 0.18, 8, 16),
      new THREE.OctahedronGeometry(0.5, 0),
      new THREE.IcosahedronGeometry(0.45, 0),
      new THREE.TorusKnotGeometry(0.3, 0.1, 32, 6),
      new THREE.DodecahedronGeometry(0.4, 0)
    ];
    const colors = MODE_BACKGROUNDS.everything.propColors;

    // Large background wireframes (reduced — meme polyhedra fill the rest)
    for (let i = 0; i < 6; i++) {
      const geo = shapes[i % shapes.length];
      const color = colors[i % colors.length];
      const mat = new THREE.MeshBasicMaterial({
        color, wireframe: true, transparent: true, opacity: 0.4 + Math.random() * 0.3
      });
      const mesh = new THREE.Mesh(geo, mat);
      const layer = i < 4 ? 'near' : 'far';
      if (layer === 'near') {
        mesh.position.set(
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 3 + 0.5,
          -2 - Math.random() * 3
        );
        mesh.scale.setScalar(0.6 + Math.random() * 0.6);
      } else {
        mesh.position.set(
          (Math.random() - 0.5) * 14,
          (Math.random() - 0.5) * 5 + 1,
          -5 - Math.random() * 8
        );
        mesh.scale.setScalar(1 + Math.random() * 1.5);
      }
      mesh.userData.floatSpeed = 0.08 + Math.random() * 0.15;
      mesh.userData.rotSpeed = 0.06 + Math.random() * 0.14;
      mesh.userData.baseY = mesh.position.y;
      mesh.userData.orbitRadius = 0.3 + Math.random() * 0.5;
      mesh.userData.orbitSpeed = 0.1 + Math.random() * 0.3;
      mesh.userData.baseX = mesh.position.x;
      this.floatingProps.push(mesh);
      this.scene.add(mesh);
    }

    // Solid glowing shapes (not wireframe) for depth
    for (let i = 0; i < 4; i++) {
      const geo = shapes[i % shapes.length];
      const color = colors[i % colors.length];
      const mat = new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.5,
        flatShading: true, transparent: true, opacity: 0.25
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 3 + 1,
        -4 - Math.random() * 6
      );
      mesh.scale.setScalar(0.8 + Math.random() * 1.2);
      mesh.userData.floatSpeed = 0.06 + Math.random() * 0.12;
      mesh.userData.rotSpeed = 0.04 + Math.random() * 0.1;
      mesh.userData.baseY = mesh.position.y;
      mesh.userData.orbitRadius = 0;
      mesh.userData.orbitSpeed = 0;
      mesh.userData.baseX = mesh.position.x;
      this.floatingProps.push(mesh);
      this.scene.add(mesh);
    }

    // === MEME SYSTEM — textured polyhedra + cubes, cycling through all images ===
    this.memeCubes = [];
    this.memeShapes = [];
    this._allMemeFaces = []; // all meme materials, for texture cycling
    this._initMemeSystem();

    // === PARTICLE SYSTEM — floating sparkle field ===
    const particleCount = 300;
    const particleGeo = new THREE.BufferGeometry();
    const pPositions = new Float32Array(particleCount * 3);
    const pColors = new Float32Array(particleCount * 3);
    const sparkleColors = [
      new THREE.Color(0xff2d95), new THREE.Color(0x00f0ff),
      new THREE.Color(0xb829dd), new THREE.Color(0x39ff14)
    ];
    for (let i = 0; i < particleCount; i++) {
      pPositions[i * 3] = (Math.random() - 0.5) * 20;
      pPositions[i * 3 + 1] = (Math.random() - 0.5) * 10 + 2;
      pPositions[i * 3 + 2] = -1 - Math.random() * 15;
      const c = sparkleColors[i % sparkleColors.length];
      pColors[i * 3] = c.r;
      pColors[i * 3 + 1] = c.g;
      pColors[i * 3 + 2] = c.b;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
    this.particlePositions = pPositions;
    this.particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
      size: 0.06, vertexColors: true, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    this.scene.add(this.particles);

    // === NEON RING behind character ===
    const ringGeo = new THREE.TorusGeometry(1.2, 0.02, 8, 64);
    this.neonRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0xff2d95, transparent: true, opacity: 0.6
    }));
    this.neonRing.position.set(0, 0.1, -0.5);
    this.scene.add(this.neonRing);

    // Second ring
    const ring2 = new THREE.Mesh(
      new THREE.TorusGeometry(1.5, 0.015, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.4 })
    );
    ring2.position.set(0, 0.1, -0.7);
    ring2.rotation.z = 0.3;
    this.neonRing2 = ring2;
    this.scene.add(ring2);

    // === REACTIVE TEXT SPRITES — headlines float around ===
    this.reactiveSprites = [];

    // === NEON COLUMNS flanking character ===
    [-2.5, 2.5].forEach(x => {
      const col = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xb829dd, transparent: true, opacity: 0.5 })
      );
      col.position.set(x, 1, -1);
      this.scene.add(col);
      // Top orb
      const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 2 })
      );
      orb.position.set(x, 4, -1);
      this.scene.add(orb);
    });
  }

  // ========== UNIFIED MEME SYSTEM — pool-based image cycling ==========
  async _initMemeSystem() {
    try {
      const res = await fetch('/api/memes');
      this._memeFiles = await res.json();
      if (!this._memeFiles.length) return;

      // Shuffled queue ensures every image is shown before any repeats
      this._memeQueue = [...this._memeFiles].sort(() => Math.random() - 0.5);
      this._memeQueueIdx = 0;
      this._memeLoader = new THREE.TextureLoader();

      this._buildMemeCubes();
      this._buildMemeShapes();
      this._startMemeTextureCycling();
    } catch (e) {
      console.warn('Meme system failed:', e);
    }
  }

  _nextMemeImage() {
    if (this._memeQueueIdx >= this._memeQueue.length) {
      // All images shown — reshuffle for next pass
      this._memeQueue = [...this._memeFiles].sort(() => Math.random() - 0.5);
      this._memeQueueIdx = 0;
    }
    return this._memeQueue[this._memeQueueIdx++];
  }

  _loadMemeTexture(filename) {
    const tex = this._memeLoader.load(`/memes/${encodeURIComponent(filename)}`);
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  _buildMemeCubes() {
    const CUBE_COUNT = Math.min(12, Math.floor(this._memeFiles.length / 6));
    if (CUBE_COUNT === 0) return;

    // Movement pattern generators — all super slow and dreamy
    const patterns = [
      () => ({ type: 'orbit', radius: 6 + Math.random() * 8, speed: 0.008 + Math.random() * 0.012,
        phase: Math.random() * Math.PI * 2, yBase: (Math.random() - 0.5) * 4,
        yAmp: 0.3 + Math.random() * 0.8, ySpeed: 0.02 + Math.random() * 0.04,
        zOffset: -3 - Math.random() * 8 }),
      () => ({ type: 'spiral', radius: 4 + Math.random() * 5, speed: 0.006 + Math.random() * 0.01,
        phase: Math.random() * Math.PI * 2, ySpeed: 0.015 + Math.random() * 0.03,
        yAmp: 2 + Math.random() * 2, zOffset: -2 - Math.random() * 6 }),
      () => ({ type: 'figure8', radius: 5 + Math.random() * 6, speed: 0.005 + Math.random() * 0.008,
        phase: Math.random() * Math.PI * 2, yBase: (Math.random() - 0.5) * 3,
        yAmp: 0.5 + Math.random() * 1.0, zOffset: -4 - Math.random() * 6 }),
      () => ({ type: 'drift', xSpeed: (Math.random() - 0.5) * 0.05, yBase: (Math.random() - 0.5) * 4,
        yAmp: 0.2 + Math.random() * 0.5, ySpeed: 0.03 + Math.random() * 0.05,
        zBase: -2 - Math.random() * 10, xBase: (Math.random() - 0.5) * 14,
        wobbleAmp: 0.3 + Math.random() * 0.8, wobbleSpeed: 0.02 + Math.random() * 0.04 }),
      () => ({ type: 'pendulum', radius: 5 + Math.random() * 5, speed: 0.01 + Math.random() * 0.012,
        arcAngle: 0.6 + Math.random() * 1.2, phase: Math.random() * Math.PI * 2,
        yBase: -1 + Math.random() * 3, zOffset: -3 - Math.random() * 7 }),
    ];

    for (let c = 0; c < CUBE_COUNT; c++) {
      const opacity = 0.2 + Math.random() * 0.8;
      const materials = [];
      for (let f = 0; f < 6; f++) {
        const mat = new THREE.MeshStandardMaterial({
          map: this._loadMemeTexture(this._nextMemeImage()),
          transparent: true, opacity,
          roughness: 0.4, metalness: 0.1,
          emissive: 0x222222, emissiveIntensity: 0.3
        });
        materials.push(mat);
        this._allMemeFaces.push(mat);
      }

      const isForeground = c < CUBE_COUNT / 3;
      const size = isForeground
        ? 0.3 + Math.random() * 0.4
        : 0.5 + Math.random() * 0.8;

      const cube = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), materials);

      const rotX = (0.03 + Math.random() * 0.08) * (Math.random() < 0.5 ? 1 : -1);
      const rotY = (0.04 + Math.random() * 0.1) * (Math.random() < 0.5 ? 1 : -1);
      const rotZ = (0.015 + Math.random() * 0.05) * (Math.random() < 0.5 ? 1 : -1);

      const patternFn = patterns[c % patterns.length];
      const motion = patternFn();

      cube.userData.memeCube = true;
      cube.userData.rotX = rotX;
      cube.userData.rotY = rotY;
      cube.userData.rotZ = rotZ;
      cube.userData.motion = motion;
      cube.userData.baseOpacity = opacity;
      cube.userData.isForeground = isForeground;
      cube.position.set(0, 0, motion.zOffset || motion.zBase || -5);

      this.scene.add(cube);
      this.memeCubes.push(cube);
    }
  }

  _buildMemeShapes() {
    // Helper: convert polyhedron geometry to per-face material groups with proper UVs
    function preparePolyGeo(geo, faceCount) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      const posCount = g.attributes.position.count;
      const vertsPerFace = posCount / faceCount;
      g.clearGroups();
      const uvs = new Float32Array(posCount * 2);
      for (let f = 0; f < faceCount; f++) {
        g.addGroup(f * vertsPerFace, vertsPerFace, f);
        const base = f * vertsPerFace;
        if (vertsPerFace === 3) {
          // Triangle face
          uvs[(base + 0) * 2] = 0.0; uvs[(base + 0) * 2 + 1] = 0.0;
          uvs[(base + 1) * 2] = 1.0; uvs[(base + 1) * 2 + 1] = 0.0;
          uvs[(base + 2) * 2] = 0.5; uvs[(base + 2) * 2 + 1] = 1.0;
        }
      }
      g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      return g;
    }

    // Shape types: box (6 faces), octahedron (8), icosahedron (20) — all 6+ sides, good variety
    const shapeConfigs = [
      { faces: 6,  geo: () => new THREE.BoxGeometry(0.4, 0.7, 0.35) },
      { faces: 8,  geo: () => preparePolyGeo(new THREE.OctahedronGeometry(0.45, 0), 8) },
      { faces: 20, geo: () => preparePolyGeo(new THREE.IcosahedronGeometry(0.4, 0), 20) },
      { faces: 6,  geo: () => new THREE.BoxGeometry(0.7, 0.35, 0.5) },
      { faces: 8,  geo: () => preparePolyGeo(new THREE.OctahedronGeometry(0.5, 0), 8) },
      { faces: 20, geo: () => preparePolyGeo(new THREE.IcosahedronGeometry(0.35, 0), 20) },
      { faces: 6,  geo: () => new THREE.BoxGeometry(0.6, 0.4, 0.6) },
      { faces: 8,  geo: () => preparePolyGeo(new THREE.OctahedronGeometry(0.4, 0), 8) },
      { faces: 6,  geo: () => new THREE.BoxGeometry(0.45, 0.45, 0.45) },
      { faces: 20, geo: () => preparePolyGeo(new THREE.IcosahedronGeometry(0.45, 0), 20) },
      { faces: 8,  geo: () => preparePolyGeo(new THREE.OctahedronGeometry(0.55, 0), 8) },
      { faces: 6,  geo: () => new THREE.BoxGeometry(0.5, 0.6, 0.4) },
      { faces: 20, geo: () => preparePolyGeo(new THREE.IcosahedronGeometry(0.38, 0), 20) },
      { faces: 8,  geo: () => preparePolyGeo(new THREE.OctahedronGeometry(0.48, 0), 8) },
      { faces: 6,  geo: () => new THREE.BoxGeometry(0.55, 0.45, 0.5) },
    ];

    const SHAPE_COUNT = shapeConfigs.length;

    for (let i = 0; i < SHAPE_COUNT; i++) {
      const config = shapeConfigs[i];
      const geo = config.geo();

      const opacity = 0.3 + Math.random() * 0.6;
      const materials = [];
      for (let f = 0; f < config.faces; f++) {
        const mat = new THREE.MeshStandardMaterial({
          map: this._loadMemeTexture(this._nextMemeImage()),
          transparent: true, opacity,
          roughness: 0.4, metalness: 0.1,
          emissive: 0x222222, emissiveIntensity: 0.3
        });
        materials.push(mat);
        this._allMemeFaces.push(mat);
      }

      const mesh = new THREE.Mesh(geo, materials);

      // Position scattered around the scene
      const isFar = i >= SHAPE_COUNT / 2;
      if (isFar) {
        mesh.position.set(
          (Math.random() - 0.5) * 14,
          (Math.random() - 0.5) * 5 + 1,
          -5 - Math.random() * 8
        );
        mesh.scale.setScalar(1.0 + Math.random() * 1.2);
      } else {
        mesh.position.set(
          (Math.random() - 0.5) * 8,
          (Math.random() - 0.5) * 3 + 0.5,
          -2 - Math.random() * 4
        );
        mesh.scale.setScalar(0.5 + Math.random() * 0.6);
      }

      // Random initial orientation
      mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);

      // Slow 3D tumble
      mesh.userData.memeShape = true;
      mesh.userData.rotX = (0.02 + Math.random() * 0.06) * (Math.random() < 0.5 ? 1 : -1);
      mesh.userData.rotY = (0.03 + Math.random() * 0.08) * (Math.random() < 0.5 ? 1 : -1);
      mesh.userData.rotZ = (0.01 + Math.random() * 0.04) * (Math.random() < 0.5 ? 1 : -1);
      mesh.userData.floatSpeed = 0.15 + Math.random() * 0.4;
      mesh.userData.baseY = mesh.position.y;
      mesh.userData.baseX = mesh.position.x;
      mesh.userData.orbitRadius = 0.2 + Math.random() * 0.6;
      mesh.userData.orbitSpeed = 0.03 + Math.random() * 0.08;

      this.scene.add(mesh);
      this.memeShapes.push(mesh);
      this.floatingProps.push(mesh);
    }
  }

  // Cycle textures every 15s so all 372 images are seen within ~30 minutes
  _startMemeTextureCycling() {
    setInterval(() => {
      if (!this._allMemeFaces.length || !this._memeFiles.length) return;
      // Swap 8 random faces per cycle
      const swapCount = Math.min(8, this._allMemeFaces.length);
      const picked = new Set();
      while (picked.size < swapCount) {
        picked.add(Math.floor(Math.random() * this._allMemeFaces.length));
      }
      for (const idx of picked) {
        const mat = this._allMemeFaces[idx];
        const oldTex = mat.map;
        mat.map = this._loadMemeTexture(this._nextMemeImage());
        mat.needsUpdate = true;
        if (oldTex) oldTex.dispose();
      }
    }, 15000);
  }

  _updateMemeCubes(elapsed, delta) {
    this.memeCubes.forEach(cube => {
      const m = cube.userData.motion;
      const t = elapsed;

      // Position based on motion type
      switch (m.type) {
        case 'orbit': {
          cube.position.x = Math.cos(t * m.speed + m.phase) * m.radius;
          cube.position.z = m.zOffset + Math.sin(t * m.speed + m.phase) * m.radius * 0.4;
          cube.position.y = m.yBase + Math.sin(t * m.ySpeed) * m.yAmp;
          break;
        }
        case 'spiral': {
          const angle = t * m.speed + m.phase;
          const r = m.radius * (0.6 + 0.4 * Math.sin(t * 0.05));
          cube.position.x = Math.cos(angle) * r;
          cube.position.z = m.zOffset + Math.sin(angle) * r * 0.5;
          cube.position.y = Math.sin(t * m.ySpeed) * m.yAmp;
          break;
        }
        case 'figure8': {
          const a = t * m.speed + m.phase;
          cube.position.x = Math.sin(a) * m.radius;
          cube.position.z = m.zOffset + Math.sin(a * 2) * m.radius * 0.3;
          cube.position.y = m.yBase + Math.sin(t * 0.2) * m.yAmp;
          break;
        }
        case 'drift': {
          cube.position.x = m.xBase + Math.sin(t * m.wobbleSpeed) * m.wobbleAmp;
          cube.position.y = m.yBase + Math.sin(t * m.ySpeed) * m.yAmp;
          cube.position.z = m.zBase + Math.sin(t * 0.03) * 2;
          break;
        }
        case 'pendulum': {
          const swing = Math.sin(t * m.speed + m.phase) * m.arcAngle;
          cube.position.x = Math.sin(swing) * m.radius;
          cube.position.z = m.zOffset + Math.cos(swing) * m.radius * 0.3;
          cube.position.y = m.yBase + Math.cos(t * 0.15) * 0.5;
          break;
        }
      }

      // Rotation — always spinning
      cube.rotation.x += cube.userData.rotX * delta;
      cube.rotation.y += cube.userData.rotY * delta;
      cube.rotation.z += cube.userData.rotZ * delta;
    });
  }

  createBroadcastLighting() {
    // Strong key light — warm, from upper-right
    const keyLight = new THREE.DirectionalLight(0xfff0e0, 2.5);
    keyLight.position.set(2, 3, 4);
    this.scene.add(keyLight);

    // Vivid cyan fill from left
    this.fillLight = new THREE.DirectionalLight(0x00f0ff, 1.5);
    this.fillLight.position.set(-3, 1, 2);
    this.scene.add(this.fillLight);

    // Hot pink rim — strong backlight for neon edge
    const rimLight = new THREE.DirectionalLight(0xff2d95, 2.0);
    rimLight.position.set(0, 2, -3);
    this.scene.add(rimLight);

    // Purple kicker from below
    const kickLight = new THREE.DirectionalLight(0xb829dd, 0.8);
    kickLight.position.set(0, -2, 2);
    this.scene.add(kickLight);

    // Bright ambient — lift everything
    const ambient = new THREE.AmbientLight(0x4a2a6e, 1.0);
    this.scene.add(ambient);

    // Hemisphere light for overall vivid fill
    const hemi = new THREE.HemisphereLight(0x00f0ff, 0xff2d95, 0.6);
    this.scene.add(hemi);

    // Point light on character position for pop
    this.charSpotlight = new THREE.PointLight(0xffffff, 1.5, 5);
    this.charSpotlight.position.set(0, 1.5, 2);
    this.scene.add(this.charSpotlight);
  }

  setupPostProcessing() {
    this.composer = new EffectComposer(this.renderer);
    this.composer.addPass(new RenderPass(this.scene, this.camera));

    this.glitchPass = new ShaderPass(GlitchShader);
    this.composer.addPass(this.glitchPass);

    this.crtPass = new ShaderPass(CRTShader);
    this.composer.addPass(this.crtPass);
  }

  // Smooth shader glitch — ramps up, holds, eases down (never snaps)
  _smoothGlitch(peak, durationMs) {
    if (this._glitchAnim) cancelAnimationFrame(this._glitchAnim);
    const start = performance.now();
    const rampUp = durationMs * 0.2;
    const hold = durationMs * 0.3;
    const rampDown = durationMs * 0.5;
    const tick = () => {
      const t = performance.now() - start;
      if (t >= durationMs) {
        this.glitchPass.uniforms.uGlitchIntensity.value = 0;
        return;
      }
      let intensity;
      if (t < rampUp) {
        const p = t / rampUp;
        intensity = peak * p * p; // ease in
      } else if (t < rampUp + hold) {
        intensity = peak;
      } else {
        const p = (t - rampUp - hold) / rampDown;
        intensity = peak * (1 - p * p); // ease out
      }
      this.glitchPass.uniforms.uGlitchIntensity.value = intensity;
      this._glitchAnim = requestAnimationFrame(tick);
    };
    this._glitchAnim = requestAnimationFrame(tick);
  }

  applyModeBackground(mode) {
    const bg = MODE_BACKGROUNDS[mode] || MODE_BACKGROUNDS.everything;

    // Sky
    this.skyMaterial.uniforms.uTopColor.value.copy(bg.skyTop);
    this.skyMaterial.uniforms.uMidColor.value.copy(bg.skyMid);
    this.skyMaterial.uniforms.uBotColor.value.copy(bg.skyBot);

    // Grid
    if (this.gridHelper) {
      this.scene.remove(this.gridHelper);
      this.gridHelper = new THREE.GridHelper(100, 40, bg.gridColor1, bg.gridColor2);
      this.gridHelper.position.y = -2;
      const gm = Array.isArray(this.gridHelper.material) ? this.gridHelper.material : [this.gridHelper.material];
      gm.forEach(m => { m.transparent = true; m.opacity = 0.6; });
      this.scene.add(this.gridHelper);
    }

    // Props (skip meme-textured shapes — they keep their own materials)
    this.floatingProps.forEach((mesh, i) => {
      if (mesh.userData.memeShape || mesh.userData.memeCube) return;
      if (mesh.material && mesh.material.color) {
        mesh.material.color.setHex(bg.propColors[i % bg.propColors.length]);
      }
    });

    // Neon ring color per mode
    if (this.neonRing) {
      const ringColors = { everything: 0xff2d95, uponly: 0x39ff14, sota: 0x00f0ff };
      this.neonRing.material.color.setHex(ringColors[mode] || 0xff2d95);
    }

    // Flames in sunglasses for "SOTA" mode
    LENS_REFLECTION.forceFlames = (mode === 'sota');

    // Mode-specific adjustments
    if (mode === 'sota') {
      this.modeGlitchMult = 1.8;
      this.crtPass.uniforms.uFlickerIntensity.value = 0.05;
      this.crtPass.uniforms.uChromaShift.value = 0.004;
    } else if (mode === 'uponly') {
      this.modeGlitchMult = 0.5;
      this.crtPass.uniforms.uFlickerIntensity.value = 0.015;
      this.crtPass.uniforms.uChromaShift.value = 0.001;
      this.fillLight.color.setHex(0xffcc80);
    } else {
      this.modeGlitchMult = 1;
      this.crtPass.uniforms.uFlickerIntensity.value = 0.02;
      this.crtPass.uniforms.uChromaShift.value = 0.002;
      this.fillLight.color.setHex(0x00f0ff);
    }
  }

  // ---------- CHARACTERS ----------

  switchCharacter(id) {
    if (this.currentCharacter) {
      this.scene.remove(this.currentCharacter.group);
    }

    if (!this.characterInstances[id]) {
      const CharClass = CHARACTER_REGISTRY[id];
      if (!CharClass) return;
      const char = new CharClass();
      char.build();
      this.characterInstances[id] = char;
    }

    // Track character selection
    fetch('/api/stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ characterId: id, action: 'select' })
    }).catch(() => {});

    this.currentCharacter = this.characterInstances[id];
    this.currentCharacterId = id;
    this.currentCharacter.group.position.x = -0.5;
    this.scene.add(this.currentCharacter.group);

    // Apply CubeCamera envMap for robot's mirror chrome
    if (id === 'robot' && this.currentCharacter.chromeMaterials) {
      const envTex = this.cubeRenderTarget.texture;
      this.currentCharacter.chromeMaterials.forEach(mat => {
        mat.envMap = envTex;
        mat.needsUpdate = true;
      });
    }

    // Apply current shades visibility
    if (this.currentCharacter.sunglasses) {
      this.currentCharacter.sunglasses.visible = this.shadesVisible;
    }

    // Update speech voice — HARD stop everything, then switch
    if (this.speech) {
      const storyIdx = this.playback ? this.playback.currentIndex : -1;
      // Kill all playback and speech immediately — must use stop() to bump _playGeneration
