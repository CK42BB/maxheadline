      // so in-flight fetchAudio/playStory calls from the old character bail out
      if (this.playback) {
        this.playback.stop();
      }
      this.speech.characterId = id;
      // Cancel any previous pending restart
      if (this._charSwitchTimer) clearTimeout(this._charSwitchTimer);

      // Trigger on-demand TTS in background + show loading if needed
      this._prepareCharacterVoice(id, storyIdx);
    }

    // Flip all story play buttons to loading, then probe for ready audio
    document.querySelectorAll('.story-play').forEach(btn => btn.classList.add('loading'));
    // If we already know this character's audio is ready, resolve instantly
    const readySet = this._audioReady.get(id);
    if (readySet) {
      this.newsEngine.stories.forEach((story, idx) => {
        if (readySet.has(story.id)) {
          const btn = document.querySelector(`.story-card[data-index="${idx}"] .story-play`);
          if (btn) btn.classList.remove('loading');
        }
      });
    }
    this._probeAudioStatus(id);
    this._startAudioProbePolling(id);

    // Update UI
    document.getElementById('char-name').textContent = CHARACTER_META[id].name.toUpperCase();
    document.querySelectorAll('#character-selector button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.char === id);
    });
  }

  // On-demand character voice preparation with creative loading states
  async _prepareCharacterVoice(charId, storyIdx) {
    const charName = CHARACTER_META[charId]?.name || charId;
    const loadingEl = document.getElementById('char-loading');
    const loadingText = document.getElementById('char-loading-text');
    const loadingFill = document.getElementById('char-loading-fill');

    // Creative loading messages per character
    const loadingMessages = {
      frog:    ['Ribbitz clearing throat...', 'Warming up the lily pad...', 'Catching flies for focus...'],
      robot:   ['CHROM-E booting up...', 'Calibrating voice circuits...', 'Running diagnostics...'],
      skull:   ['Mortimer rising from grave...', 'Reassembling jaw bone...', 'Dusting off the crypt...'],
      fox:     ['Voxel stretching...', 'Sharpening those instincts...', 'Adjusting the fur...'],
      owl:     ['Hootspa waking up...', 'Rotating head 270 degrees...', 'Getting reading glasses...'],
      cat:     ['Whiskers napping... one sec...', 'Knocking things off desk...', 'Stretching... slowly...'],
      wizard:  ['Glitch consulting the orb...', 'Gathering arcane notes...', 'Enchanting the mic...']
    };

    const msgs = loadingMessages[charId] || [`${charName} getting ready...`];

    // Check if this character's audio is available for the current story
    if (storyIdx >= 0 && this.newsEngine.stories.length > storyIdx) {
      const story = this.newsEngine.stories[storyIdx];
      const energy = currentEnergyMode;

      // Quick check: does the first clip exist?
      const testUrl = `/api/audio/${encodeURIComponent(charId)}/${encodeURIComponent(story.id)}-headline/${energy}`;
      try {
        const probe = await fetch(testUrl, { method: 'HEAD' });
        if (probe.ok) {
          // Audio ready — play immediately
          this._charSwitchTimer = setTimeout(() => {
            this._charSwitchTimer = null;
            this.playback.playStory(storyIdx);
          }, 200);
          return;
        }
      } catch (e) {}

      // Audio not ready — show loading, trigger on-demand generation
      loadingEl.classList.add('visible');
      loadingText.textContent = msgs[0];
      loadingFill.style.width = '5%';

      // Kick off server-side generation
      fetch('/api/prepare-character', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ characterId: charId, mode: this.currentMode || 'everything' })
      }).catch(() => {});

      // Poll for the specific clip we need (not all — just the current story)
      let msgIdx = 0;
      const pollInterval = setInterval(async () => {
        // Cycle loading messages
        msgIdx = (msgIdx + 1) % msgs.length;
        loadingText.textContent = msgs[msgIdx];

        try {
          const check = await fetch(testUrl, { method: 'HEAD' });
          if (check.ok) {
            // Ready! Re-probe all story cards (server generates all at once)
            this._probeAudioStatus(charId);
            clearInterval(pollInterval);
            loadingFill.style.width = '100%';
            loadingText.textContent = `${charName} is live!`;
            setTimeout(() => {
              loadingEl.classList.remove('visible');
              if (this.currentCharacterId === charId) {
                this.playback.playStory(storyIdx);
              }
            }, 600);
          } else {
            // Increment progress bar estimate
            const w = parseFloat(loadingFill.style.width) || 5;
            loadingFill.style.width = Math.min(90, w + 8) + '%';
          }
        } catch (e) {}
      }, 2500);

      // Timeout after 45s — fall back to Web Speech
      setTimeout(() => {
        clearInterval(pollInterval);
        if (loadingEl.classList.contains('visible')) {
          loadingEl.classList.remove('visible');
          if (this.currentCharacterId === charId && storyIdx >= 0) {
            this.playback.playStory(storyIdx);
          }
        }
      }, 45000);

    } else if (storyIdx >= 0) {
      // No specific story context, just play
      this._charSwitchTimer = setTimeout(() => {
        this._charSwitchTimer = null;
        this.playback.playStory(storyIdx);
      }, 300);
    }
  }

  // Probe audio availability for all stories for a given character
  async _probeAudioStatus(charId) {
    const stories = this.newsEngine.stories;
    if (!stories.length) return;

    if (!this._audioReady.has(charId)) {
      this._audioReady.set(charId, new Set());
    }
    const readySet = this._audioReady.get(charId);

    const probes = stories.map(async (story, index) => {
      const url = `/api/audio/${encodeURIComponent(charId)}/${encodeURIComponent(story.id)}-headline/${currentEnergyMode}`;
      try {
        const res = await fetch(url, { method: 'HEAD' });
        const btn = document.querySelector(`.story-card[data-index="${index}"] .story-play`);
        if (res.ok) {
          readySet.add(story.id);
          if (btn) btn.classList.remove('loading');
        } else {
          if (btn && this.currentCharacterId === charId) btn.classList.add('loading');
        }
      } catch {
        // network error — leave as loading
      }
    });

    await Promise.all(probes);
    return readySet.size >= stories.length;
  }

  // Start polling audio status until all stories are ready, then stop
  _startAudioProbePolling(charId) {
    if (this._audioProbeInterval) clearInterval(this._audioProbeInterval);
    this._audioProbeInterval = setInterval(async () => {
      if (this.currentCharacterId !== charId) {
        clearInterval(this._audioProbeInterval);
        this._audioProbeInterval = null;
        return;
      }
      const allReady = await this._probeAudioStatus(charId);
      if (allReady) {
        clearInterval(this._audioProbeInterval);
        this._audioProbeInterval = null;
      }
    }, 3000);
  }

  // ---------- UI ----------

  setupUI() {
    // Character selector
    const charSel = document.getElementById('character-selector');
    const charBtnColors = {
      frog:    { bg: '#2E7D32', border: '#66BB6A', glow: 'rgba(76,175,80,0.5)' },
      robot:   { bg: '#37474F', border: '#78909C', glow: 'rgba(120,144,156,0.5)' },
      skull:   { bg: '#263238', border: '#607D8B', glow: 'rgba(96,125,139,0.5)' },
      fox:     { bg: '#BF360C', border: '#FF6E40', glow: 'rgba(255,110,64,0.5)' },
      owl:     { bg: '#3E2723', border: '#A1887F', glow: 'rgba(141,110,99,0.5)' },
      cat:     { bg: '#E65100', border: '#FFB74D', glow: 'rgba(255,183,77,0.5)' },
      wizard:  { bg: '#311B92', border: '#B388FF', glow: 'rgba(124,77,255,0.5)' }
    };
    // Helper: render emoji to white canvas image
    const makeWhiteEmoji = (emoji) => {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.font = '48px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 32, 36);
      // Extract alpha to make white version
      const imgData = ctx.getImageData(0, 0, 64, 64);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const a = d[i + 3]; // keep alpha
        d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; // white
        d[i + 3] = a;
      }
      ctx.putImageData(imgData, 0, 0);
      return c.toDataURL();
    };
    Object.entries(CHARACTER_META).forEach(([id, meta]) => {
      const colors = charBtnColors[id] || { bg: '#333', border: '#666', glow: 'rgba(255,255,255,0.3)' };
      const btn = document.createElement('button');
      btn.dataset.char = id;
      btn.title = meta.name;
      btn.style.background = `linear-gradient(135deg, ${colors.bg}, ${colors.bg}dd)`;
      btn.style.borderColor = colors.border;
      btn.style.setProperty('--char-glow', colors.glow);
      // White emoji as img
      const img = document.createElement('img');
      img.src = makeWhiteEmoji(meta.emoji);
      img.className = 'char-icon';
      img.draggable = false;
      btn.appendChild(img);
      if (id === this.currentCharacterId) btn.classList.add('active');
      btn.addEventListener('click', () => {
        this.switchCharacter(id);
        if (this.currentCharacter) this.currentCharacter.triggerGlitch();
      });
      charSel.appendChild(btn);
    });

    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => this.switchMode(btn.dataset.mode));
    });

    // Transport
    document.getElementById('btn-autoplay').addEventListener('click', () => {
      this.playback.toggleAutoplay();
      this.updateAutoplayBtn();
    });
    document.getElementById('btn-skip').addEventListener('click', () => this.playback.skip());
    document.getElementById('btn-refresh').addEventListener('click', () => this.refreshStories());
    document.getElementById('btn-shades').addEventListener('click', () => {
      this.shadesVisible = !this.shadesVisible;
      const btn = document.getElementById('btn-shades');
      btn.classList.toggle('active', this.shadesVisible);
      // Update all cached characters
      Object.values(this.characterInstances).forEach(c => {
        if (c.sunglasses) c.sunglasses.visible = this.shadesVisible;
      });
    });
    // Initialize shades button as active
    document.getElementById('btn-shades').classList.add('active');

    // Size the ? button to be a perfect circle matching other button heights
    requestAnimationFrame(() => {
      const refBtn = document.getElementById('btn-skip');
      const searchBtn = document.getElementById('btn-search');
      if (refBtn && searchBtn) {
        const h = refBtn.offsetHeight;
        searchBtn.style.width = h + 'px';
        searchBtn.style.height = h + 'px';
        searchBtn.style.lineHeight = h + 'px';
      }
    });

    // Search button — opens Google search for the current story
    document.getElementById('btn-search').addEventListener('click', () => {
      const idx = this.playback ? this.playback.currentIndex : -1;
      const story = this.newsEngine && this.newsEngine.stories && this.newsEngine.stories[idx >= 0 ? idx : 0];
      if (story) {
        const q = encodeURIComponent(story.headline);
        window.open(`https://www.google.com/search?q=${q}`, '_blank');
      }
    });

  }

  updateAutoplayBtn() {
    const btn = document.getElementById('btn-autoplay');
    btn.classList.toggle('active', this.playback.isAutoplay);
    btn.textContent = this.playback.isAutoplay ? '\u23F8 AUTO' : '\u25B6 AUTO';
  }

  async switchMode(mode) {
    if (mode === this.currentMode) return;
    this.currentMode = mode;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

    // Smooth glitch transition — ramp up, hold, ease out
    this._smoothGlitch(0.6, 400);

    this.applyModeBackground(mode);

    // Stop current playback
    this.playback.stop();

    // Fetch new stories
    this.showLoading();
    this.newsEngine._cache[mode] = null; // Force refresh on mode switch
    await this.newsEngine.fetchNews(mode, CHARACTER_META[this.currentCharacterId].name);
    this.renderStoryFeed();
    this._probeAudioStatus(this.currentCharacterId);
    this.updateHeadlineTicker();
    if (this.storyHero && this.newsEngine.stories.length) {
      await this.storyHero.loadStoryImages(this.newsEngine.stories);
      this.storyHero.setActiveStory(0);
    }
  }

  async refreshStories() {
    this.playback.stop();
    this._smoothGlitch(0.4, 300);

    this.showLoading();
    this.newsEngine._cache[this.currentMode] = null;
    await this.newsEngine.fetchNews(this.currentMode, CHARACTER_META[this.currentCharacterId].name);
    this.renderStoryFeed();
    this._probeAudioStatus(this.currentCharacterId);
    this.updateHeadlineTicker();
    if (this.storyHero && this.newsEngine.stories.length) {
      await this.storyHero.loadStoryImages(this.newsEngine.stories);
      this.storyHero.setActiveStory(0);
    }
  }

  showLoading() {
    const feed = document.getElementById('story-feed');
    feed.innerHTML = `
      <div class="loading-state">
        <div class="glitch-text" data-text="SCANNING FREQUENCIES...">SCANNING FREQUENCIES...</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
      </div>
    `;
  }

  renderStoryFeed() {
    const feed = document.getElementById('story-feed');
    feed.innerHTML = '';
    this.newsEngine.stories.forEach((story, index) => {
      const card = document.createElement('div');
      card.className = 'story-card';
      card.dataset.index = index;

      const severityBar = '\u2588'.repeat(story.severity) + '\u2591'.repeat(10 - story.severity);

      const sevLabel = story.severity >= 9 ? 'CRITICAL' : story.severity >= 7 ? 'HIGH IMPACT' : story.severity >= 4 ? 'MODERATE' : 'LOW IMPACT';

      const summaryBullets = story.summary.split(/(?<=[.!?])\s+/).filter(s => s.trim()).map(s => `<li>${s.trim()}</li>`).join('');
      const realStoryHtml = story.summaryHighkey
        ? `<div class="story-realstory"><div class="story-realstory-label">The Real Story</div><p>${story.summaryHighkey}</p></div>`
        : '';

      card.innerHTML = `
        <div class="story-header">
          <span class="story-emotion emotion-${story.emotion}">${story.category}</span>
          <span class="story-category">${sevLabel} &bull; ${story.source}</span>
        </div>
        <h3 class="story-headline">${story.headline}</h3>
        <ul class="story-summary">${summaryBullets}</ul>
        ${realStoryHtml}
        <div class="story-footer">
          <span class="story-severity">${severityBar}</span>
          <span class="story-source">${story.source}</span>
          <button class="story-play loading" data-story-id="${story.id}">\u25B6</button>
        </div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') this.playback.playStory(index);
      });
      card.querySelector('.story-play').addEventListener('click', () => this.playback.playStory(index));

      // Staggered fade-in
      card.style.opacity = '0';
      card.style.transform = 'translateY(10px)';
      card.style.transition = 'opacity 0.3s, transform 0.3s';
      setTimeout(() => {
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, index * 80);

      feed.appendChild(card);
    });
  }

  updateHeadlineTicker() {
    const container = document.getElementById('headline-ticker-content');
    if (!container || !this.newsEngine.stories.length) return;
    const headlines = this.newsEngine.stories.map(s => {
      // Truncate to ~8 words
      const words = s.headline.split(' ').slice(0, 8);
      return words.join(' ') + (s.headline.split(' ').length > 8 ? '...' : '');
    });
    // Build content — duplicate for seamless loop
    const buildItems = () => headlines.map(h =>
      `<span class="ticker-item">${h}</span><span class="ticker-sep">\u25C6</span>`
    ).join('');
    container.innerHTML = buildItems() + buildItems();
    // Adjust speed based on content width
    requestAnimationFrame(() => {
      const width = container.scrollWidth / 2;
      const speed = Math.max(30, width / 60); // ~60px/sec
      container.style.animationDuration = speed + 's';
    });
  }

  setActiveStory(index) {
    document.querySelectorAll('.story-card').forEach(c => c.classList.remove('active'));
    const card = document.querySelector(`.story-card[data-index="${index}"]`);
    if (card) {
      card.classList.add('active');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // Legacy — replaced by launchBroadcast() splash flow
  async doIntroGreeting() { this.launchBroadcast(); }

  // ---------- RENDER ----------

  animate() {
    const delta = this.clock.getDelta();
    const elapsed = this.clock.getElapsedTime();

    // Update character
    if (this.currentCharacter) {
      if (this.speech.isSpeaking) {
        this.currentCharacter.updateSpeaking(elapsed, delta, this.speechAmplitude);
      } else {
        this.currentCharacter.updateIdle(elapsed, delta);
      }
    }

    // "SOTA" mode — occasional deliberate glitch
    if (this.currentMode === 'sota' && this.currentCharacter && !this.speech.isSpeaking) {
      if (Math.random() < 0.001) {
        this.currentCharacter.triggerGlitch();
      }
    }

    // Meme cubes — complex motion paths
    if (this.memeCubes.length) this._updateMemeCubes(elapsed, delta);

    // Floating props — rotation + float + orbital drift
    this.floatingProps.forEach(mesh => {
      if (mesh.userData.memeShape) {
        // Meme shapes: full 3-axis tumble (delta-scaled for smooth, slow rotation)
        mesh.rotation.x += mesh.userData.rotX * delta;
        mesh.rotation.y += mesh.userData.rotY * delta;
        mesh.rotation.z += mesh.userData.rotZ * delta;
      } else {
        mesh.rotation.x += mesh.userData.rotSpeed * delta;
        mesh.rotation.y += mesh.userData.rotSpeed * 0.7 * delta;
      }
      mesh.position.y = mesh.userData.baseY + Math.sin(elapsed * mesh.userData.floatSpeed) * 0.4;
      if (mesh.userData.orbitRadius > 0) {
        mesh.position.x = mesh.userData.baseX + Math.sin(elapsed * mesh.userData.orbitSpeed) * mesh.userData.orbitRadius;
      }
      // Pulse opacity with speech
      if (this.speech.isSpeaking && mesh.material && mesh.material.opacity !== undefined) {
        const pulse = 0.1 * this.speechAmplitude * Math.sin(elapsed * 4 + mesh.userData.floatSpeed * 10);
        mesh.material.opacity = Math.min(1, mesh.material.opacity + pulse);
      }
    });

    // Neon rings — rotate and pulse
    if (this.neonRing) {
      this.neonRing.rotation.z = elapsed * 0.06;
      this.neonRing.rotation.x = Math.sin(elapsed * 0.15) * 0.08;
      this.neonRing.material.opacity = 0.4 + 0.3 * Math.sin(elapsed * 2);
      // Expand ring when speaking
      const ringScale = this.speech.isSpeaking ? 1 + this.speechAmplitude * 0.15 : 1;
      this.neonRing.scale.setScalar(ringScale);
    }
    if (this.neonRing2) {
      this.neonRing2.rotation.z = -elapsed * 0.04 + 0.3;
      this.neonRing2.material.opacity = 0.3 + 0.2 * Math.sin(elapsed * 1.5 + 1);
    }

    // Particles — drift upward, twinkle
    if (this.particles && this.particlePositions) {
      const pp = this.particlePositions;
      for (let i = 0; i < pp.length / 3; i++) {
        pp[i * 3 + 1] += delta * (0.1 + Math.sin(i) * 0.05); // drift up
        pp[i * 3] += Math.sin(elapsed * 0.5 + i * 0.1) * delta * 0.1; // sway
        if (pp[i * 3 + 1] > 8) {
          pp[i * 3 + 1] = -3;
          pp[i * 3] = (Math.random() - 0.5) * 20;
        }
      }
      this.particles.geometry.attributes.position.needsUpdate = true;
      // Pulse particle size with speech
      this.particles.material.size = 0.06 + (this.speech.isSpeaking ? this.speechAmplitude * 0.04 : 0);
    }

    // Spawn reactive headline sprites when speaking
    if (this.speech.isSpeaking && this.speechAmplitude > 0.7 && Math.random() < 0.03) {
      this.spawnReactiveShape();
    }

    // Update reactive sprites
    this.reactiveSprites = this.reactiveSprites.filter(obj => {
      obj.life -= delta;
      if (obj.life <= 0) { this.scene.remove(obj.mesh); return false; }
      obj.mesh.position.y += delta * obj.speed;
      obj.mesh.position.x += Math.sin(elapsed * 2 + obj.phase) * delta * 0.3;
      obj.mesh.rotation.z += delta * obj.spin;
      obj.mesh.material.opacity = Math.min(1, obj.life * 2);
      return true;
    });

    // Lens reflection animation
    LENS_REFLECTION.update(elapsed);

    // Story hero image
    if (this.storyHero) {
      this.storyHero.update(elapsed, delta);
    }

    // Financial ticker scroll
    if (this.financialTicker) {
      this.financialTicker.update(elapsed);
    }

    // Shader time
    this.skyMaterial.uniforms.uTime.value = elapsed;
    this.crtPass.uniforms.uTime.value = elapsed;
    this.glitchPass.uniforms.uTime.value = elapsed;

    // CubeCamera update for robot mirror reflections (every 3 frames for perf)
    if (this.currentCharacterId === 'robot' && this.currentCharacter) {
      this._cubeCameraFrame++;
      if (this._cubeCameraFrame % 3 === 0) {
        // Position cube camera at robot's head
        const charPos = this.currentCharacter.group.position;
        this.cubeCamera.position.set(charPos.x, charPos.y + 0.1, charPos.z);

        // Hide robot during env capture (no self-reflection artifacts)
        this.currentCharacter.group.visible = false;

        // Show hidden reflection studio panels
        this.reflectionPanels.forEach(p => p.visible = true);

        // Render cubemap
        this.cubeCamera.update(this.renderer, this.scene);

        // Restore
        this.reflectionPanels.forEach(p => p.visible = false);
        this.currentCharacter.group.visible = true;
      }
    }

    // Render
    this.composer.render();
  }

  spawnReactiveShape() {
    const geos = [
      new THREE.OctahedronGeometry(0.15, 0),
      new THREE.TetrahedronGeometry(0.15, 0),
      new THREE.IcosahedronGeometry(0.12, 0),
      new THREE.TorusGeometry(0.1, 0.04, 4, 8)
    ];
    const colors = [0xff2d95, 0x00f0ff, 0xb829dd, 0x39ff14, 0xff6b2b, 0xffff00];
    const geo = geos[Math.floor(Math.random() * geos.length)];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color, wireframe: Math.random() > 0.5, transparent: true, opacity: 0.9
    }));
    mesh.position.set(
      (Math.random() - 0.5) * 3,
      -0.5 + Math.random() * 0.5,
      -0.5 - Math.random() * 2
    );
    this.scene.add(mesh);
    this.reactiveSprites.push({
      mesh, life: 2 + Math.random() * 2, speed: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 3
    });
  }

  // ---------- RESIZE ----------

  updateRendererSize() {
    const viewport = document.getElementById('viewport');
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    this.renderer.setSize(w, h);
    if (this.composer) this.composer.setSize(w, h);
  }

  onResize() {
    const viewport = document.getElementById('viewport');
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
    if (this.composer) this.composer.setSize(w, h);
    if (this.storyHero) this.storyHero.onResize();
  }
}

// =====================================================================
// BOOT — Two-phase: background init, then user-triggered launch
// =====================================================================
let appBooted = false;
let appInstance = null;

async function bootBackground() {
  if (appBooted) return;
  appBooted = true;

  const splash = document.getElementById('splash');
  const status = document.getElementById('splash-status');
  const goBtn = document.getElementById('splash-go');
  const bar = document.getElementById('splash-bar');

  // Phase 1: Build scene + fetch news in background (no audio yet)
  status.textContent = 'Building broadcast stage...';
  appInstance = new MaxHeadlineApp();

  try {
    await appInstance.initScene();

    // Show the app and start rendering NOW — scene animates behind transparent splash
    document.getElementById('app').classList.remove('app-hidden');
    appInstance.onResize();
    appInstance.renderer.setAnimationLoop(() => appInstance.animate());

    status.textContent = 'Scanning frequencies...';
    await appInstance.initNews();
  } catch (err) {
    console.error('Init failed:', err);
  }

  // Phase 2: Pre-load first story audio so it's ready before button click
  let firstAudioReady = false;
  if (appInstance.newsEngine.stories.length > 0) {
    status.textContent = 'Tuning voice circuits...';
    const firstStory = appInstance.newsEngine.stories[0];
    try {
      const headlineRes = await fetch(`/api/audio/${encodeURIComponent(appInstance.currentCharacterId)}/${encodeURIComponent(firstStory.id)}-headline/${currentEnergyMode}`);
      const summaryRes = await fetch(`/api/audio/${encodeURIComponent(appInstance.currentCharacterId)}/${encodeURIComponent(firstStory.id)}-summary/${currentEnergyMode}`);
      if (headlineRes.ok && summaryRes.ok) {
        // Cache the raw array buffers for instant decode on launch
        appInstance._preloadedHeadline = await headlineRes.arrayBuffer();
        appInstance._preloadedSummary = await summaryRes.arrayBuffer();
        firstAudioReady = true;
      } else {
        // Try frog fallback
        const frogH = await fetch(`/api/audio/frog/${encodeURIComponent(firstStory.id)}-headline/${currentEnergyMode}`);
        const frogS = await fetch(`/api/audio/frog/${encodeURIComponent(firstStory.id)}-summary/${currentEnergyMode}`);
        if (frogH.ok && frogS.ok) {
          appInstance._preloadedHeadline = await frogH.arrayBuffer();
          appInstance._preloadedSummary = await frogS.arrayBuffer();
          firstAudioReady = true;
        }
      }
    } catch (e) { /* audio preload failed, will try live TTS */ }
  }

  status.textContent = firstAudioReady ? 'Signal locked.' : 'Broadcast ready.';

  // Show the button, hide loading bar
  bar.style.display = 'none';
  goBtn.style.display = 'inline-block';

  // Phase 3: User clicks "LET'S NEWS" — satisfies AudioContext gesture
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true;
    goBtn.textContent = 'GOING LIVE...';

    // Create and unlock AudioContext inside user gesture (critical for mobile)
    await appInstance.speech.unlockAudio();

    // Fade out transparent splash overlay
    splash.classList.add('hidden');

    // Start playback + lazy load audio in background
    appInstance.launchBroadcast();

    // Remove splash from DOM after fade transition
    setTimeout(() => splash.remove(), 900);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  bootBackground();
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
});
</script>
</body>
</html>
